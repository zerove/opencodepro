# Sisyphus 认知执行引擎 — 配置文件
# ============================================================
# 此文件可通过 `Config::from_file("config.toml")` 加载。
# 所有字段都有默认值，可省略；环境变量以 `SISYPHUS_*` 前缀覆盖。
#
# 使用方式:
#   SISYPHUS_CONFIG=/path/to/config.toml cargo run -p sisyphus-bridge
# 或直接放置 config.toml 在工作目录下自动加载。

# ── LLM 客户端参数 ──────────────────────────────────────────
[llm]
# API key（建议通过 SISYPHUS_LLM_API_KEY 环境变量设置）
# 环境变量: SISYPHUS_LLM_API_KEY
# 类型: string | 默认: ""
api_key = ""

# LLM API 端点
# 环境变量: SISYPHUS_LLM_ENDPOINT
# 类型: string | 默认: "http://localhost:8000/v1/chat/completions"
endpoint = "http://localhost:8000/v1/chat/completions"

# 默认模型名称
# 环境变量: SISYPHUS_LLM_MODEL
# 类型: string | 默认: "gpt-4o"
model = "gpt-4o"

# 预算执行模式: "Warning"（仅警告）或 "Strict"（超出即拒绝）
# 环境变量: SISYPHUS_LLM_BUDGET_MODE
# 类型: string | 默认: "Warning"
# budget_mode = "Warning"

# 嵌入向量配置（用于语义搜索 / 记忆检索）
[llm.embedding]
# 嵌入模型名称
# 环境变量: SISYPHUS_LLM_EMBEDDING_MODEL
# 类型: string | 默认: "text-embedding-3-small"
# model = "text-embedding-3-small"

# 嵌入 API 端点（可选，默认使用 llm.endpoint）
# 环境变量: SISYPHUS_LLM_EMBEDDING_ENDPOINT
# 类型: string | 默认: None
# endpoint = "http://localhost:8000/v1/embeddings"

# 嵌入 provider（"dummy", "openai" 等）
# 环境变量: SISYPHUS_LLM_EMBEDDING_PROVIDER
# 类型: string | 默认: "dummy"
# provider = "dummy"

# 按 agent 的模型覆盖（可选）
# key = agent_id（如 "metis", "librarian", "momus"）
# [llm.agents]
# "metis" = { model = "gpt-4o", endpoint = "http://localhost:8000/v1/chat/completions" }
# "librarian" = { model = "gpt-4o-mini" }

# 按类别（category）的模型路由（可选）
# key = category 名称
# [llm.categories]
# "reasoning" = { model = "gpt-4o", strategy = "round-robin" }

# 多 provider 配置（可选，用于 fallback）
# [[llm.providers]]
# name = "google-gemini"
# kind = "google"
# endpoint = "https://generativelanguage.googleapis.com/v1"
# api_key = "env:GEMINI_API_KEY"
# model = "gemini-2.0-flash"
# priority = 10
# enabled = true

# [[llm.providers]]
# name = "anthropic-claude"
# kind = "anthropic"
# endpoint = "https://api.anthropic.com/v1"
# api_key = "env:ANTHROPIC_API_KEY"
# model = "claude-sonnet-4-20250514"
# priority = 20
# enabled = true

# ── 认证令牌 ──────────────────────────────────────────────────
# 可选的 bearer token，用于保护 bridge HTTP 和 gRPC 接口
# 环境变量: SISYPHUS_AUTH_TOKEN
# 类型: string | 默认: ""（不启用认证）
auth_token = ""

# gRPC bridge 地址（格式: http://[host]:port）
# 环境变量: SISYPHUS_BRIDGE_ADDRESS
# 类型: string | 默认: "http://[::1]:50051"
bridge_address = "http://[::1]:50051"

# HTTP REST API 地址（格式: http://[host]:port）
# 环境变量: SISYPHUS_HTTP_ADDRESS
# 类型: string | 默认: "http://[::1]:8080"
http_address = "http://[::1]:8080"

# ── 认知循环参数 ──────────────────────────────────────────
[cognitive_loop]
# 最大认知迭代次数（预测→执行→反思→进化循环上限）
# 环境变量: SISYPHUS_COGNITIVE_LOOP_MAX_ITERATIONS
# 类型: u32 | 默认: 10
max_iterations = 10

# 收敛阈值 — 偏差低于此值时提前停止循环
# 范围: 0.0 ~ 1.0（越低越严格）
# 环境变量: SISYPHUS_COGNITIVE_LOOP_CONVERGENCE_THRESHOLD
# 类型: f64 | 默认: 0.15
convergence_threshold = 0.15

# ── 自适应深度控制器参数 (认知循环 v2) ────────────────────
[cognitive_loop.adaptive_depth]
# 初始迭代预算倍数
# 环境变量: SISYPHUS_COGNITIVE_LOOP_ADAPTIVE_DEPTH_INITIAL_BUDGET
# 类型: f64 | 默认: 2.0
# initial_budget = 2.0

# 每次迭代衰减因子
# 环境变量: SISYPHUS_COGNITIVE_LOOP_ADAPTIVE_DEPTH_DECAY
# 类型: f64 | 默认: 0.3
# decay = 0.3

# 继续迭代所需的最小改进
# 环境变量: SISYPHUS_COGNITIVE_LOOP_ADAPTIVE_DEPTH_MIN_IMPROVEMENT
# 类型: f64 | 默认: 0.15
# min_improvement = 0.15

# 基于置信度的收敛阈值
# 环境变量: SISYPHUS_COGNITIVE_LOOP_ADAPTIVE_DEPTH_CONVERGENCE_THRESHOLD
# 类型: f64 | 默认: 0.05
# convergence_threshold = 0.05

# ── 混沌工程参数 ──────────────────────────────────────────
[chaos]
# 启动时是否启用混沌工程
# 环境变量: SISYPHUS_CHAOS_ENABLED
# 类型: bool | 默认: false
# enabled = false

# 默认故障注入概率
# 环境变量: SISYPHUS_CHAOS_DEFAULT_FAULT_PROBABILITY
# 类型: f64 | 默认: 0.1
# default_fault_probability = 0.1

# 实验自动停止时间（秒）
# 环境变量: SISYPHUS_CHAOS_DEFAULT_DURATION_SECONDS
# 类型: u64 | 默认: 300
# default_duration_seconds = 300

# ── DAG 执行器参数 ────────────────────────────────────────
[executor]
# 最大并行任务数（JoinSet 并发上限）
# 环境变量: SISYPHUS_EXECUTOR_MAX_CONCURRENT_TASKS
# 类型: usize | 默认: 16
max_concurrent_tasks = 16

# 默认 fuel 上限（WASM 指令数）
# 环境变量: SISYPHUS_EXECUTOR_DEFAULT_FUEL
# 类型: u64 | 默认: 1000000
default_fuel = 1_000_000

# ── 两级缓存参数（L1 LRU + L2 SQLite/PostgreSQL）───────
[cache]
# L1 内存缓存容量（条目数）
# 环境变量: SISYPHUS_CACHE_L1_CAPACITY
# 类型: usize | 默认: 10000
l1_capacity = 10_000

# 数据库连接 URL（支持 sqlite: 或 postgres://）
# SQLite:  sqlite:data/sisyphus.db
# PostgreSQL + pgvector:  postgres://user:pass@host/sisyphus
# 环境变量: SISYPHUS_CACHE_DATABASE_URL
# 类型: string | 默认: "sqlite:data/sisyphus.db"
database_url = "sqlite:data/sisyphus.db"

# 启用向量语义搜索（PostgreSQL 需安装 pgvector 扩展）
# SQLite 模式：全表扫描 + 内存余弦相似度
# PostgreSQL 模式：pgvector ANN（<-> 算子），自动创建 extension
# 环境变量: SISYPHUS_CACHE_ENABLE_VECTORS
# 类型: bool | 默认: false
enable_vectors = false

# 向量嵌入维度（仅 enable_vectors=true 时有效）
# 环境变量: SISYPHUS_CACHE_VECTOR_DIMENSION
# 类型: usize | 默认: 1536
vector_dimension = 1536

# ── Prometheus 指标导出 ───────────────────────────────────
[metrics]
# Prometheus HTTP 导出端口（监听 0.0.0.0）
# 环境变量: SISYPHUS_METRICS_PROMETHEUS_PORT
# 类型: u16 | 默认: 9100
prometheus_port = 9100

# ── WASM 沙箱参数 ─────────────────────────────────────────
[sandbox]
# WASM 线性内存上限（以 64KB 页为单位）
# 环境变量: SISYPHUS_SANDBOX_MAX_MEMORY_PAGES
# 类型: u32 | 默认: 10
max_memory_pages = 10

# 沙箱默认 fuel 上限（WASM 指令数）
# 环境变量: SISYPHUS_SANDBOX_DEFAULT_FUEL
# 类型: u64 | 默认: 1000000
default_fuel = 1_000_000

# WASM 工具二进制文件目录
# 环境变量: SISYPHUS_SANDBOX_WASM_TOOLS_DIR
# 类型: string | 默认: "tools"
wasm_tools_dir = "tools"

# 使用独立进程 sandboxd 替代嵌入式 wasmtime（解决 OOM）
# 当为 true 时，bridge 启动 sisyphus-sandboxd 子进程执行 WASM
# 环境变量: SISYPHUS_SANDBOX_USE_SANDBOXD
# 类型: bool | 默认: false
use_sandboxd = false

# sisyphus-sandboxd 二进制路径（默认在 PATH 中搜索）
# 仅 use_sandboxd = true 时有效
# 环境变量: SISYPHUS_SANDBOX_SANDBOXD_PATH
# 类型: string | 默认: "sisyphus-sandboxd"（PATH 搜索）
sandboxd_path = "sisyphus-sandboxd"

# ── MCP 外部工具服务器 ─────────────────────────────────────
[mcp]

  # 基于 stdio 的 MCP 服务器: prefix = "command --args ..."
  # 工具以 "prefix:tool_name" 调用
  [mcp.stdio_servers]
  # "custom" = "my-mcp-server --port 9000"

  # TS/Zod 自定义工具 (.opencode/tools/*.ts)
  # 需要先 npm install: cd workers/ts-tools-mcp && npm install
  "tools" = "npx tsx workers/ts-tools-mcp/src/index.ts"

  # 基于 HTTP 的 MCP 服务器: prefix = "http://..."
  [mcp.http_servers]
  # "remote" = "http://localhost:3000/mcp"

# ── 远程技能注册表 ──────────────────────────────────────────
[registry]
# 远程技能注册表 URL
# 环境变量: SISYPHUS_REGISTRY_URL
# 类型: string | 默认: "https://registry.sisyphus.ai"
registry_url = "https://registry.sisyphus.ai"

# 请求超时秒数
# 环境变量: SISYPHUS_REGISTRY_TIMEOUT_SECONDS
# 类型: u64 | 默认: 30
# timeout_seconds = 30

# ── Jcode 调试集成 ──────────────────────────────────────────
[jcode]
# Jcode 调试 socket 路径（用于 bridge → jcode IPC）
# 环境变量: SISYPHUS_JCODE_SOCKET_PATH
# 类型: string | 默认: "/tmp/jcode-debug.sock"
socket_path = "/tmp/jcode-debug.sock"
