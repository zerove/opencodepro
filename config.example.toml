# Sisyphus 认知执行引擎 — 配置文件
# ============================================================
# 此文件可通过 `Config::from_file("config.toml")` 加载。
# 所有字段都有默认值，可省略；环境变量以 `SISYPHUS_*` 前缀覆盖。
#
# 使用方式:
#   SISYPHUS_CONFIG=/path/to/config.toml cargo run -p sisyphus-bridge
# 或直接放置 config.toml 在工作目录下自动加载。

# ── LLM 客户端参数 ──────────────────────────────────────────
[llm]
# API key（建议通过 SISYPHUS_LLM_API_KEY 环境变量设置）
# 环境变量: SISYPHUS_LLM_API_KEY
# 类型: string | 默认: ""
api_key = ""

# LLM API 端点
# 环境变量: SISYPHUS_LLM_ENDPOINT
# 类型: string | 默认: "http://localhost:8000/v1/chat/completions"
endpoint = "http://localhost:8000/v1/chat/completions"

# 默认模型名称
# 环境变量: SISYPHUS_LLM_MODEL
# 类型: string | 默认: "gpt-4o"
model = "gpt-4o"

# 预算执行模式: "Warning"（仅警告）或 "Strict"（超出即拒绝）
# 环境变量: SISYPHUS_LLM_BUDGET_MODE
# 类型: string | 默认: "Warning"
# budget_mode = "Warning"

# 快速失败冷却时间（秒）— 连接失败后在此窗口内直接拒绝该模型调用
# 环境变量: SISYPHUS_LLM_FAST_FAIL_COOLING_SECS
# 类型: u64 | 默认: 30
# fast_fail_cooling_secs = 30

# LLM 请求超时（秒）
# 环境变量: SISYPHUS_LLM_REQUEST_TIMEOUT_SECS
# 类型: u64 | 默认: 5
# request_timeout_secs = 5

# LLM 连接超时（秒）
# 环境变量: SISYPHUS_LLM_CONNECT_TIMEOUT_SECS
# 类型: u64 | 默认: 2
# connect_timeout_secs = 2

# 嵌入向量配置（用于语义搜索 / 记忆检索）
[llm.embedding]
# 嵌入模型名称
# 环境变量: SISYPHUS_LLM_EMBEDDING_MODEL
# 类型: string | 默认: "text-embedding-3-small"
# model = "text-embedding-3-small"

# 嵌入 API 端点（可选，默认使用 llm.endpoint）
# 环境变量: SISYPHUS_LLM_EMBEDDING_ENDPOINT
# 类型: string | 默认: None
# endpoint = "http://localhost:8000/v1/embeddings"

# 嵌入 provider（"dummy", "openai" 等）
# 环境变量: SISYPHUS_LLM_EMBEDDING_PROVIDER
# 类型: string | 默认: "dummy"
# provider = "dummy"

# 是否允许使用伪嵌入（仅用于测试/开发）
# 当 provider 不是 "openai" 时，若为 false，桥接启动会失败
# 环境变量: SISYPHUS_LLM_EMBEDDING_ALLOW_DUMMY
# 类型: bool | 默认: false
# allow_dummy_embeddings = false

# 按 agent 的模型覆盖（可选）
# key = agent_id（如 "metis", "librarian", "momus"）
# [llm.agents]
# "metis" = { model = "gpt-4o", endpoint = "http://localhost:8000/v1/chat/completions" }
# "librarian" = { model = "gpt-4o-mini" }

# 按类别（category）的模型路由（可选）
# key = category 名称
# [llm.categories]
# "reasoning" = { model = "gpt-4o", strategy = "round-robin" }

# 多 provider 配置（可选，用于 fallback）
# [[llm.providers]]
# name = "google-gemini"
# kind = "google"
# endpoint = "https://generativelanguage.googleapis.com/v1"
# api_key = "env:GEMINI_API_KEY"
# model = "gemini-2.0-flash"
# priority = 10
# enabled = true

# [[llm.providers]]
# name = "anthropic-claude"
# kind = "anthropic"
# endpoint = "https://api.anthropic.com/v1"
# api_key = "env:ANTHROPIC_API_KEY"
# model = "claude-sonnet-4-20250514"
# priority = 20
# enabled = true

# OpenAI 兼容类（Groq / Mistral / Together）共享 OpenAiCompatibleProvider 客户端
# 仅 endpoint 与 model 不同；切换生产 provider 只需改这两个字段

# [[llm.providers]]
# name = "groq-llama"
# kind = "groq"
# endpoint = "https://api.groq.com/openai/v1/chat/completions"
# api_key = "env:GROQ_API_KEY"
# model = "llama-3.1-70b-versatile"
# priority = 5   # 优先级最高 → fallback 链首选
# enabled = true

# [[llm.providers]]
# name = "mistral-large"
# kind = "mistral"
# endpoint = "https://api.mistral.ai/v1/chat/completions"
# api_key = "env:MISTRAL_API_KEY"
# model = "mistral-large-latest"
# priority = 15
# enabled = true

# [[llm.providers]]
# name = "together-llama"
# kind = "together"
# endpoint = "https://api.together.xyz/v1/chat/completions"
# api_key = "env:TOGETHER_API_KEY"
# model = "meta-llama/Llama-3.3-70B-Instruct-Turbo"
# priority = 25
# enabled = true

# [[llm.providers]]
# OpenRouter — 多模型聚合（一个 API key 路由到任意上游模型）。
# 透传 OpenAI 协议；自动注入 HTTP-Referer / X-Title headers
# （可在 base_url 中显式设置归因站点）。
# 可用模型见 https://openrouter.ai/models
# name = "openrouter-aggregator"
# kind = "openrouter"
# endpoint = "https://openrouter.ai/api/v1/chat/completions"
# api_key = "env:OPENROUTER_API_KEY"
# model = "anthropic/claude-3.5-sonnet"
# base_url = "https://your-site.example.com"  # 可选：作为 OpenRouter 归因 referer
# priority = 5  # 数值越小优先级越高
# enabled = true

# 可选的 bearer token，用于保护 bridge HTTP 和 gRPC 接口
# 环境变量: SISYPHUS_AUTH_TOKEN
# 类型: string | 默认: ""（不启用认证）
auth_token = ""

# ── JWT 认证（REST API token 认证）─────────────────────────────
[jwt]
# 签名密钥（生产环境必须设置；设置后 REST API 启用 JWT 认证）
# 环境变量: SISYPHUS_JWT_SECRET
# 类型: string | 默认: ""（不启用）
# secret = ""

# Access token 有效期（秒）
# 环境变量: SISYPHUS_JWT_ACCESS_TTL_SECS
# 类型: i64 | 默认: 900（15 分钟）
# access_ttl_secs = 900

# Token 签发者
# 环境变量: SISYPHUS_JWT_ISSUER
# 类型: string | 默认: "sisyphus-bridge"
# issuer = "sisyphus-bridge"

# gRPC bridge 地址（格式: http://[host]:port）
# 环境变量: SISYPHUS_BRIDGE_ADDRESS
# 类型: string | 默认: "http://[::1]:50051"
bridge_address = "http://[::1]:50051"

# HTTP REST API 地址（格式: http://[host]:port）
# 环境变量: SISYPHUS_HTTP_ADDRESS
# 类型: string | 默认: "http://[::1]:8080"
http_address = "http://[::1]:8080"

# ── 认知循环参数 ──────────────────────────────────────────
[cognitive_loop]
# 最大认知迭代次数（预测→执行→反思→进化循环上限）
# 环境变量: SISYPHUS_COGNITIVE_LOOP_MAX_ITERATIONS
# 类型: u32 | 默认: 10
max_iterations = 10

# 循环内 LLM 阶段统一超时秒数（反思/演进/逻辑审计/批判）；0 表示禁用对应阶段的 LLM 调用
# 环境变量: SISYPHUS_COGNITIVE_LOOP_LLM_STAGE_TIMEOUT_SECS
# 类型: u64 | 默认: 30
# llm_stage_timeout_secs = 30

# 收敛阈值 — 偏差低于此值时提前停止循环
# 范围: 0.0 ~ 1.0（越低越严格）
# 环境变量: SISYPHUS_COGNITIVE_LOOP_CONVERGENCE_THRESHOLD
# 类型: f64 | 默认: 0.15
#
# 生效方式：实际阈值 = min(自适应档位, 本值)。
# 自适应档位由 ComplexityAnalyzer 按复杂度给出
# （Low 0.2 / Medium 0.05 / High 0.01 / Ultra 0.005），
# 因此本值只能在**更严**的方向生效——写更大的数不会放宽判定。
# 设为 0.0 表示不额外收紧，完全采用自适应档位。
convergence_threshold = 0.15

# ── 自适应深度控制器参数 (认知循环 v2) ────────────────────
[cognitive_loop.adaptive_depth]
# 初始迭代预算倍数
# 环境变量: SISYPHUS_COGNITIVE_LOOP_ADAPTIVE_DEPTH_INITIAL_BUDGET
# 类型: f64 | 默认: 2.0
# initial_budget = 2.0

# 每次迭代衰减因子
# 环境变量: SISYPHUS_COGNITIVE_LOOP_ADAPTIVE_DEPTH_DECAY
# 类型: f64 | 默认: 0.3
# decay = 0.3

# 继续迭代所需的最小改进
# 环境变量: SISYPHUS_COGNITIVE_LOOP_ADAPTIVE_DEPTH_MIN_IMPROVEMENT
# 类型: f64 | 默认: 0.15
# min_improvement = 0.15

# 基于置信度的收敛阈值
# 环境变量: SISYPHUS_COGNITIVE_LOOP_ADAPTIVE_DEPTH_CONVERGENCE_THRESHOLD
# 类型: f64 | 默认: 0.05
# convergence_threshold = 0.05

# ── 反思/演进阶段 Token 预算 ──────────────────────────────
# 硬上限 token 数；为 None 时表示不启用预算（默认 unbounded）
# 环境变量: SISYPHUS_COGNITIVE_LOOP_TOKEN_BUDGET_CAP (空字符串 = 清除上限)
# 类型: u64 | 默认: None
[cognitive_loop.token_budget]
# cap = 100000

# 保留比例 [0.0, 1.0]。当剩余预算 < cap × reserve_ratio 时跳过 LLM 调用
# 环境变量: SISYPHUS_COGNITIVE_LOOP_TOKEN_BUDGET_RESERVE_RATIO
# 类型: f64 | 默认: 0.1
# reserve_ratio = 0.1

# ── 异常检测器阈值 (认知循环 v2) ───────────────────────────
# 监控每节点执行指标（燃料/耗时/错误率），超过阈值倍数时触发内联反思。
# 类型层 `AnomalyDetectorConfig` 端到端接通。
[cognitive_loop.anomaly_detector]
# 燃料倍数阈值：观测值 > expected × fuel_threshold 触发异常
# 环境变量: SISYPHUS_COGNITIVE_LOOP_ANOMALY_DETECTOR_FUEL_THRESHOLD
# 类型: f64 (> 0) | 默认: 2.0
# fuel_threshold = 2.0

# 耗时倍数阈值：观测值 > expected × duration_threshold 触发异常
# 环境变量: SISYPHUS_COGNITIVE_LOOP_ANOMALY_DETECTOR_DURATION_THRESHOLD
# 类型: f64 (> 0) | 默认: 3.0
# duration_threshold = 3.0

# 错误率阈值：节点历史错误率 > error_rate_threshold 触发异常
# 环境变量: SISYPHUS_COGNITIVE_LOOP_ANOMALY_DETECTOR_ERROR_RATE_THRESHOLD
# 类型: f64 [0.0, 1.0] | 默认: 0.3
# error_rate_threshold = 0.3

# 移动平均的窗口大小（≥ 1；内部若传入 0 会被静默纠正为 1）
# 环境变量: SISYPHUS_COGNITIVE_LOOP_ANOMALY_DETECTOR_HISTORY_WINDOW
# 类型: usize (≥ 1) | 默认: 20
# history_window = 20

# ── 混沌工程参数 ──────────────────────────────────────────
[chaos]
# 启动时是否启用混沌工程
# 环境变量: SISYPHUS_CHAOS_ENABLED
# 类型: bool | 默认: false
# enabled = false

# 默认故障注入概率
# 环境变量: SISYPHUS_CHAOS_DEFAULT_FAULT_PROBABILITY
# 类型: f64 | 默认: 0.1
# default_fault_probability = 0.1

# 实验自动停止时间（秒）
# 环境变量: SISYPHUS_CHAOS_DEFAULT_DURATION_SECONDS
# 类型: u64 | 默认: 300
# default_duration_seconds = 300

# ── 集群 peer 协议（ADR-009 / ADR-016）────────────────────
[cluster]
# 是否启用集群 peer 协议（mDNS discovery + 静态 peer fallback）
# 环境变量: SISYPHUS_CLUSTER_ENABLED
# 类型: bool | 默认: false
# enabled = false

# 本节点唯一 ID（留空 = 启动时从 SISYPHUS_CLUSTER_NODE_ID / HOSTNAME 派生）
# 环境变量: SISYPHUS_CLUSTER_NODE_ID
# 类型: string | 默认: ""
# node_id = ""

# 集群名（多套集群并存时区分）
# 环境变量: SISYPHUS_CLUSTER_NAME
# 类型: string | 默认: "_sisyphus-bridge"
# cluster_name = "_sisyphus-bridge"

# mDNS 服务类型（RFC 6763）
# 类型: string | 默认: "_sisyphus-bridge._tcp.local"
# mdns_service_type = "_sisyphus-bridge._tcp.local"

# 静态 peer 列表（K8s 等多播受限环境 fallback）
# 类型: ["host:port", ...] | 默认: []
# peers = ["node-1:50051", "node-2:50051"]

# Join 超时（秒），须 ≥ 1
# 环境变量: SISYPHUS_CLUSTER_JOIN_TIMEOUT_SECS
# 类型: u64 | 默认: 10
# join_timeout_secs = 10

# Peer TTL（秒）：超过此时间无心跳视为离线，须 ≥ 5 且 > join_timeout_secs
# 环境变量: SISYPHUS_CLUSTER_PEER_TTL_SECS
# 类型: u64 | 默认: 30
# peer_ttl_secs = 30

# 联邦经验聚合（v0.4.0 Phase A）：对入站 peer 经验按质量分过滤。
# 默认关闭——关闭时入站经验全量进入 CRDT 合并，行为与 v0.3.0 一致。
[cluster.federated]
# 是否启用入站经验质量门槛
# 环境变量: SISYPHUS_CLUSTER_FEDERATED_ENABLED
# 类型: bool | 默认: false
# enabled = false

# 允许合并的最低质量分（[0.0, 1.0]）；低于此分的远端经验被丢弃并记 warn 日志
# 环境变量: SISYPHUS_CLUSTER_FEDERATED_MIN_QUALITY_SCORE
# 类型: f64 | 默认: 0.2
# min_quality_score = 0.2

# 成功经验基础权重（≥ 0）
# 环境变量: SISYPHUS_CLUSTER_FEDERATED_SUCCESS_WEIGHT
# 类型: f64 | 默认: 0.7
# success_weight = 0.7

# 偏差扣分权重（≥ 0）
# 环境变量: SISYPHUS_CLUSTER_FEDERATED_DEVIATION_WEIGHT
# 类型: f64 | 默认: 0.3
# deviation_weight = 0.3

# ── DAG 执行器参数 ────────────────────────────────────────
[executor]
# 最大并行任务数（JoinSet 并发上限）
# 环境变量: SISYPHUS_EXECUTOR_MAX_CONCURRENT_TASKS
# 类型: usize | 默认: 16
max_concurrent_tasks = 16

# 默认 fuel 上限（WASM 指令数）
# 环境变量: SISYPHUS_EXECUTOR_DEFAULT_FUEL
# 类型: u64 | 默认: 1000000
default_fuel = 1_000_000

# ── 两级缓存参数（L1 LRU + L2 SQLite/PostgreSQL）───────
[cache]
# L1 内存缓存容量（条目数）
# 环境变量: SISYPHUS_CACHE_L1_CAPACITY
# 类型: usize | 默认: 10000
l1_capacity = 10_000

# 数据库连接 URL（支持 sqlite: 或 postgres://）
# SQLite:  sqlite:data/sisyphus.db
# PostgreSQL + pgvector:  postgres://user:pass@host/sisyphus
# 环境变量: SISYPHUS_CACHE_DATABASE_URL
# 类型: string | 默认: "sqlite:data/sisyphus.db"
database_url = "sqlite:data/sisyphus.db"

# 启用向量语义搜索（PostgreSQL 需安装 pgvector 扩展）
# SQLite 模式：全表扫描 + 内存余弦相似度
# PostgreSQL 模式：pgvector ANN（<-> 算子），自动创建 extension
# 环境变量: SISYPHUS_CACHE_ENABLE_VECTORS
# 类型: bool | 默认: false
enable_vectors = false

# 向量嵌入维度（仅 enable_vectors=true 时有效）
# 环境变量: SISYPHUS_CACHE_VECTOR_DIMENSION
# 类型: usize | 默认: 1536
vector_dimension = 1536

# L2 批量写入阈值 — 缓冲积累到此条数后原子提交到数据库
# 类型: usize | 默认: 100
batch_size = 100

# L2 强制刷新间隔（毫秒）— 即使未达批次阈值也会定期落盘
# 类型: u64 | 默认: 100
flush_interval_ms = 100

# ── Prometheus 指标导出 ───────────────────────────────────
[metrics]
# Prometheus HTTP 导出端口（监听 0.0.0.0）
# 环境变量: SISYPHUS_METRICS_PROMETHEUS_PORT
# 类型: u16 | 默认: 9100
prometheus_port = 9100

# ── OpenTelemetry 分布式追踪 ───────────────────────────────
[metrics.opentelemetry]
# 是否启用 OpenTelemetry 导出
# 环境变量: SISYPHUS_METRICS_OTEL_ENABLED
# 类型: bool | 默认: false
# enabled = false

# OTLP 导出端点
# 环境变量: SISYPHUS_METRICS_OTEL_ENDPOINT
# 类型: string | 默认: "http://localhost:4317"
# endpoint = "http://localhost:4317"

# 服务名称（用于追踪标识）
# 环境变量: SISYPHUS_METRICS_OTEL_SERVICE_NAME
# 类型: string | 默认: "sisyphus-bridge"
# service_name = "sisyphus-bridge"

# 采样率 (0.0 ~ 1.0)
# 环境变量: SISYPHUS_METRICS_OTEL_SAMPLE_RATE
# 类型: f64 | 默认: 1.0
# sample_rate = 1.0

# ── WASM 沙箱参数 ─────────────────────────────────────────
[sandbox]
# WASM 线性内存上限（以 64KB 页为单位）
# 环境变量: SISYPHUS_SANDBOX_MAX_MEMORY_PAGES
# 类型: u32 | 默认: 10
max_memory_pages = 10

# 沙箱默认 fuel 上限（WASM 指令数）
# 环境变量: SISYPHUS_SANDBOX_DEFAULT_FUEL
# 类型: u64 | 默认: 1000000
default_fuel = 1_000_000

# WASM 工具二进制文件目录
# 环境变量: SISYPHUS_SANDBOX_WASM_TOOLS_DIR
# 类型: string | 默认: "tools"
wasm_tools_dir = "tools"

# 使用独立进程 sandboxd 替代嵌入式 wasmtime（解决 OOM）
# 当为 true 时，bridge 启动 sisyphus-sandboxd 子进程执行 WASM
# 环境变量: SISYPHUS_SANDBOX_USE_SANDBOXD
# 类型: bool | 默认: false
use_sandboxd = false

# sisyphus-sandboxd 二进制路径（默认在 PATH 中搜索）
# 仅 use_sandboxd = true 时有效
# 环境变量: SISYPHUS_SANDBOX_SANDBOXD_PATH
# 类型: string | 默认: "sisyphus-sandboxd"（PATH 搜索）
sandboxd_path = "sisyphus-sandboxd"

# ── MCP 外部工具服务器 ─────────────────────────────────────
[mcp]

  # 基于 stdio 的 MCP 服务器: prefix = "command --args ..."
  # 工具以 "prefix:tool_name" 调用
  [mcp.stdio_servers]
  # "custom" = "my-mcp-server --port 9000"

  # TS/Zod 自定义工具 (.opencode/tools/*.ts)
  # 需要先 npm install: cd workers/ts-tools-mcp && npm install
  "tools" = "npx tsx workers/ts-tools-mcp/src/index.ts"

  # 基于 HTTP 的 MCP 服务器: prefix = "http://..."
  [mcp.http_servers]
  # "remote" = "http://localhost:3000/mcp"

# ── 远程技能注册表 ──────────────────────────────────────────
[registry]
# 远程技能注册表 URL
# 环境变量: SISYPHUS_REGISTRY_URL
# 类型: string | 默认: "https://registry.sisyphus.ai"
registry_url = "https://registry.sisyphus.ai"

# 请求超时秒数
# 环境变量: SISYPHUS_REGISTRY_TIMEOUT_SECONDS
# 类型: u64 | 默认: 30
# timeout_seconds = 30

# ── Jcode 调试集成 ──────────────────────────────────────────
[jcode]
# Jcode 调试 socket 路径（用于 bridge → jcode IPC）
# 环境变量: SISYPHUS_JCODE_SOCKET_PATH
# 类型: string | 默认: "/tmp/jcode-debug.sock"
socket_path = "/tmp/jcode-debug.sock"
