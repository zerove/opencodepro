[package]
name = "eval-runner"
version = "0.2.0"
edition = "2021"
repository.workspace = true
description = "Evaluation harnesses (metis / momus / librarian / scribe / security)"
authors.workspace = true
license = "MIT OR Apache-2.0"

[dependencies]
walkdir = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
regex = "1.10"
jsonschema = "0.17"
sisyphus-tools-core = { version = "0.2.0", path = "../crates/sisyphus-tools-core" }
sisyphus-tools-llm = { version = "0.2.0", path = "../crates/sisyphus-tools-llm" }
sisyphus-tools-executor = { version = "0.2.0", path = "../crates/sisyphus-tools-executor" }
sisyphus-types = { version = "0.2.0", path = "../crates/sisyphus-types" }
sisyphus-intel = { version = "0.2.0", path = "../crates/sisyphus-intel" }
sisyphus-mem = { version = "0.2.0", path = "../crates/sisyphus-mem" }
anyhow = "1.0"
prettytable-rs = "0.10"
reqwest = { version = "0.11", features = ["json"] }

[[bin]]
name = "eval-runner"
path = "runner.rs"

[[bin]]
name = "golden-sop-eval"
path = "golden_sop/eval.rs"

[[bin]]
name = "recall-benchmark"
path = "golden_sop/recall_benchmark.rs"

[[bin]]
name = "golden-sop-exec"
path = "golden_sop/exec_eval.rs"

[[bin]]
name = "golden-sop-trend"
path = "golden_sop/trend.rs"

[[bin]]
name = "self-prog-demo"
path = "self_prog_demo.rs"

[[bin]]
name = "http-client-bench"
path = "http_client_bench.rs"

# ADR-007 §1 自动化: 扫生产代码 unwrap/expect/panic 调用
# 替代 Python check_no_panic.py, 保持纯 Rust 工具链
[[bin]]
name = "no-panic-check"
path = "no_panic_check.rs"

# ADR-007 §4 自动化: 量化 sisyphus_metrics 覆盖率
[[bin]]
name = "metrics-coverage"
path = "metrics_coverage.rs"
