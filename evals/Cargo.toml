[package]
name = "eval-runner"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
regex = "1.10"
jsonschema = "0.17"
sisyphus-tools-core = { path = "../crates/sisyphus-tools-core" }
sisyphus-tools-llm = { path = "../crates/sisyphus-tools-llm" }
sisyphus-tools-executor = { path = "../crates/sisyphus-tools-executor" }
sisyphus-types = { path = "../crates/sisyphus-types" }
sisyphus-mem = { path = "../crates/sisyphus-mem" }
anyhow = "1.0"
prettytable-rs = "0.10"
reqwest = { version = "0.11", features = ["json"] }

[[bin]]
name = "eval-runner"
path = "runner.rs"

[[bin]]
name = "golden-sop-eval"
path = "golden_sop/eval.rs"

[[bin]]
name = "recall-benchmark"
path = "golden_sop/recall_benchmark.rs"

[[bin]]
name = "golden-sop-exec"
path = "golden_sop/exec_eval.rs"

[[bin]]
name = "golden-sop-trend"
path = "golden_sop/trend.rs"
