apiVersion: v1
kind: Secret
metadata:
  name: sisyphus-bridge-secrets
  namespace: sisyphus
  labels:
    app.kubernetes.io/name: sisyphus-bridge
    app.kubernetes.io/component: secret
type: Opaque
# 生产请用 sealed-secrets / external-secrets / vault 替换
stringData:
  # OpenAI 凭据（base64 编码示例）
  SISYPHUS_LLM_API_KEY: "REPLACE_WITH_SECRETS_OPERATOR_OUTPUT"
  # 鉴权 token（base64 编码示例）
  SISYPHUS_AUTH_TOKEN: "REPLACE_WITH_SECRETS_OPERATOR_OUTPUT"
  # JWT 签名密钥
  SISYPHUS_JWT_SECRET: "REPLACE_WITH_SECRETS_OPERATOR_OUTPUT"
