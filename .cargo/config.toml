[target.x86_64-unknown-linux-gnu]
# linker 使用系统默认（/usr/bin/gcc on GitHub runner / Debian/Ubuntu）
# 不再硬编码绝对路径，避免 CI 环境无法解析
#
# 不要开 mold：已实测无效（2026-10-04，本机 mold 2.40.4）。
# 链接 SIGABRT 的根因是 vm.overcommit_memory=2 的**提交量**上限，
# 而非链接器的物理驻留（RSS）。mold 省的是 RSS，撞的仍是 commit：
#   mold: fatal: ...: mmap failed: Cannot allocate memory
# 即换链接器治不了这个问题，且实测崩得**更早**（编依赖阶段就失败）。
# 详见 docs/project-status-2026-10-04.md 第 5.4.3 节。
# rustflags = ["-C", "link-args=-fuse-ld=mold"]

[alias]
# ── sisyphus-core 测试 ──────────────────────────────────
ct-core    = "test -p sisyphus-core"
ct-quick   = "test -p sisyphus-core --lib"
ct-core-it = "test -p sisyphus-core --test cognitive_loop_test --test composite_test --test executor_test --test experience_test --test evolution_test --test synthesis_test"
ct-core-min = "test -p sisyphus-core --lib --no-default-features"

# ── sisyphus-tools 测试（子 crates） ────────────────────
ct-tools   = "test -p sisyphus-tools-core -p sisyphus-tools-llm -p sisyphus-tools-scm -p sisyphus-tools-build -p sisyphus-tools-system -p sisyphus-tools-mcp -p sisyphus-tools-llm-tools -p sisyphus-tools-session -p sisyphus-tools-executor -p sisyphus-tools-agent"

# ── 全 workspace 检查/测试（排除 3 个 wasmtime 依赖 crate）
#     sisyphus-bridge、sisyphus-sandbox、sisyphus-tests 需单独编译
check-all  = "check --workspace --exclude sisyphus-bridge --exclude sisyphus-sandbox --exclude sisyphus-sandboxd --exclude sisyphus-tests"
build-all  = "build --workspace --exclude sisyphus-bridge --exclude sisyphus-sandbox --exclude sisyphus-sandboxd --exclude sisyphus-tests"
# `-j 1` 不是保险：本机 19.5 GiB 下默认并行链接多个测试二进制会 OOM
# （`linking with cc failed`），见 Makefile 头部。别名无法设置环境变量，
# 所以用等价的 `-j`；但**它传不进测试内部再拉起的嵌套 cargo**（如
# `rust_tests`），那条路径仍需要 `make test-all` 的 CARGO_BUILD_JOBS=1。
test-all   = "test --workspace --exclude sisyphus-bridge --exclude sisyphus-sandbox --exclude sisyphus-sandboxd --exclude sisyphus-tests -j 1"

# ── 单独 crates ──────────────────────────────────────────
ch-cli     = "check -p sisyphus-cli"
ch-bridge  = "check -p sisyphus-bridge"
ch-core    = "check -p sisyphus-core"
ch-types   = "check -p sisyphus-types"
ch-sandbox = "check -p sisyphus-sandbox"
ch-sandboxd = "check -p sisyphus-sandboxd"
ch-tests   = "check -p sisyphus-tests"

# ── Release ──────────────────────────────────────────────
rel-cli    = "build --release -p sisyphus-cli"
rel-bridge = "build --release -p sisyphus-bridge"
