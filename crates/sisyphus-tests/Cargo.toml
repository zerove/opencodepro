[package]
name = "sisyphus-tests"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
sisyphus-core = { path = "../sisyphus-core" }
sisyphus-intel = { path = "../sisyphus-intel" }
sisyphus-mem = { path = "../sisyphus-mem" }
sisyphus-sandbox = { path = "../sisyphus-sandbox" }
sisyphus-types = { path = "../sisyphus-types" }
sisyphus-knowledge = { path = "../sisyphus-knowledge" }
sisyphus-tools-executor = { path = "../sisyphus-tools-executor" }
sisyphus_visual = { path = "../sisyphus-visual" }
tokio = { version = "1", features = ["full"] }
serde_json = { workspace = true }
async-trait = { workspace = true }
petgraph = "0.6"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tempfile = "3.8"
sisyphus-tools-llm = { path = "../sisyphus-tools-llm" }
sisyphus-roadmap = { path = "../sisyphus-roadmap" }
sisyphus-tools-llm-tools = { path = "../sisyphus-tools-llm-tools" }
sisyphus-tools-core = { path = "../sisyphus-tools-core" }
sisyphus-tools-agent = { path = "../sisyphus-tools-agent" }
sisyphus-bridge = { path = "../sisyphus-bridge" }
parking_lot = "0.12"
sisyphus-tools-build = { path = "../sisyphus-tools-build" }
sisyphus-cli = { path = "../sisyphus-cli" }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
