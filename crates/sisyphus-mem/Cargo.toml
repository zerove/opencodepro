[package]
name = "sisyphus-mem"
version = "0.1.0"
edition = "2024"

[dependencies]
dashmap = "6.0"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
sisyphus-types = { path = "../sisyphus-types" }
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4"] }
