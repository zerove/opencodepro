[package]
name = "sisyphus-mem"
version = "0.1.0"
edition = "2024"
authors = ["Sisyphus Team"]
description = "Memory-First State: DashMap L1 + SQLite L2 with snapshot/restore"
license = "MIT"

[features]
alt-sql-store = []

[dependencies]
lru = "0.12"
parking_lot = "0.12"
rayon = "1.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "postgres", "any", "migrate", "uuid", "chrono", "json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { version = "1.0", features = ["full"] }
async-trait = { workspace = true }
sisyphus-types = { version = "0.1.0", path = "../sisyphus-types" }
sisyphus-metrics = { version = "0.1.0", path = "../sisyphus-metrics" }
anyhow = { workspace = true }
uuid = { version = "1.0", features = ["v4"] }
tracing = { workspace = true }
sisyphus-tools-llm = { version = "0.1.0", path = "../sisyphus-tools-llm" }
md5 = "0.8.0"
dashmap = "6.0"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"] }
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.8"
# sqlx::any 在测试时需 install_drivers, sqlx-sqlite 提供 DRIVER 常量
sqlx-sqlite = { version = "0.8" }
