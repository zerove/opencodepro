[package]
name = "sisyphus-mem"
version = "0.1.0"
edition = "2024"
authors = ["Sisyphus Team"]
description = "Memory-First State: DashMap L1 + SQLite L2 with snapshot/restore"
license = "MIT"

[dependencies]
lru = "0.12"
parking_lot = "0.12"
rayon = "1.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { version = "1.0", features = ["full"] }
async-trait = { workspace = true }
sisyphus-types = { path = "../sisyphus-types" }
sisyphus-metrics = { path = "../sisyphus-metrics" }
anyhow = { workspace = true }
uuid = { version = "1.0", features = ["v4"] }
tracing = { workspace = true }
sisyphus-tools-llm = { version = "0.1.0", path = "../sisyphus-tools-llm" }
md5 = "0.8.0"

[dev-dependencies]
tempfile = "3.8"
