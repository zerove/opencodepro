[package]
name = "sisyphus-mem"
version = "0.1.0"
edition = "2024"
authors = ["Sisyphus Team"]
description = "Memory-First State: DashMap L1 + SQLite L2 with snapshot/restore"
license = "MIT"

[dependencies]
dashmap = "6.0"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
sisyphus-types = { path = "../sisyphus-types" }
sisyphus-metrics = { path = "../sisyphus-metrics" }
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4"] }
tracing = { workspace = true }
