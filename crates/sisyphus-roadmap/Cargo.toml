[package]
name = "sisyphus-roadmap"
version = "0.1.0"
edition = "2021"
authors = ["Sisyphus Team"]
description = "Strategic planning layer: Project → Milestone → Phase → Goal hierarchy with MfsStore persistence"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
sisyphus-types = { path = "../sisyphus-types" }
sisyphus-mem = { path = "../sisyphus-mem" }
sisyphus-tools-llm = { path = "../sisyphus-tools-llm" }
