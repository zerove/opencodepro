[package]
name = "sisyphus-roadmap"
version = "0.3.0"
edition = "2021"
repository.workspace = true
authors = ["Sisyphus Team"]
description = "Strategic planning layer: Project → Milestone → Phase → Goal hierarchy with MfsStore persistence"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
metrics = "0.24"
thiserror = { workspace = true }
sisyphus-types = { version = "0.3.0", path = "../sisyphus-types" }
sisyphus-mem = { version = "0.3.0", path = "../sisyphus-mem" }
sisyphus-tools-llm = { version = "0.3.0", path = "../sisyphus-tools-llm" }
anyhow.workspace = true

[dev-dependencies]
sisyphus-mem = { version = "0.3.0", path = "../sisyphus-mem" }
sisyphus-tools-llm = { version = "0.3.0", path = "../sisyphus-tools-llm" }
sisyphus-types = { version = "0.3.0", path = "../sisyphus-types" }
async-trait = "0.1"
tempfile = "3"
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
