[package]
name = "sisyphus-roadmap"
version = "0.4.0"
publish = false
edition = "2021"
repository.workspace = true
authors = ["Sisyphus Team"]
description = "Strategic planning layer: Project → Milestone → Phase → Goal hierarchy with MfsStore persistence"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
metrics = "0.24"
thiserror = { workspace = true }
sisyphus-types = { version = "0.4.0", path = "../sisyphus-types" }
sisyphus-mem = { version = "0.4.0", path = "../sisyphus-mem" }
sisyphus-tools-llm = { version = "0.4.0", path = "../sisyphus-tools-llm" }
anyhow.workspace = true

[dev-dependencies]
tempfile = "3"
