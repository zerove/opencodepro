[package]
name = "sisyphus-tools-build"
version = "0.2.0"
edition = "2021"
repository.workspace = true
description = "Build, test, and LSP tools with per-language backends"
authors.workspace = true
license = "MIT OR Apache-2.0"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1.0", features = ["process", "fs", "io-util", "time", "rt", "macros"] }
regex = "1.0"
tracing = { workspace = true }
metrics = "0.24"
ignore = "0.4"
sisyphus-types = { version = "0.2.0", path = "../sisyphus-types" }
sisyphus-tools-core = { version = "0.2.0", path = "../sisyphus-tools-core" }
sisyphus-tools-llm = { version = "0.2.0", path = "../sisyphus-tools-llm" }

[dev-dependencies]
tempfile = "3"
