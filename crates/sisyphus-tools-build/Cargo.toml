[package]
name = "sisyphus-tools-build"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1.0", features = ["process", "fs", "io-util", "time", "rt", "macros"] }
regex = "1.0"
tracing = { workspace = true }
ignore = "0.4"
sisyphus-types = { path = "../sisyphus-types" }
sisyphus-tools-core = { path = "../sisyphus-tools-core" }

[dev-dependencies]
tempfile = "3"
