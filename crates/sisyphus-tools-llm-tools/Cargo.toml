[package]
name = "sisyphus-tools-llm-tools"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
sisyphus-tools-core = { version = "0.1.0", path = "../sisyphus-tools-core" }
sisyphus-tools-llm = { version = "0.1.0", path = "../sisyphus-tools-llm" }
sisyphus-tools-build = { version = "0.1.0", path = "../sisyphus-tools-build" }
sisyphus-tools-system = { version = "0.1.0", path = "../sisyphus-tools-system" }
sisyphus-types = { version = "0.1.0", path = "../sisyphus-types" }
regex = "1.0"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { version = "1.0", features = ["process", "fs", "io-util", "time", "rt", "macros"] }
tracing = { workspace = true }
metrics = "0.24"

[dev-dependencies]
tempfile = "3"
