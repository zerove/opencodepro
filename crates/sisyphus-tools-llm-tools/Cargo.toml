[package]
name = "sisyphus-tools-llm-tools"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
sisyphus-tools-core = { path = "../sisyphus-tools-core" }
sisyphus-tools-llm = { path = "../sisyphus-tools-llm" }
sisyphus-tools-build = { path = "../sisyphus-tools-build" }
sisyphus-tools-system = { path = "../sisyphus-tools-system" }
sisyphus-types = { path = "../sisyphus-types" }
regex = "1.0"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { version = "1.0", features = ["process", "fs", "io-util", "time", "rt", "macros"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
