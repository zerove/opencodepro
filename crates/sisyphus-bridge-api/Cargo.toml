[package]
name = "sisyphus-bridge-api"
version = "0.4.2"
publish = false
edition = "2021"
repository.workspace = true
authors.workspace = true
license = "MIT"
description = "Shared gRPC types, client wrapper, and server trait for the Sisyphus Bridge protocol"

[dependencies]
metrics = "0.24"
tonic = { version = "0.12", features = ["transport", "tls"] }
prost = "0.13"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
anyhow = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
tonic-build = "0.12"

# cargo-machete 误报声明：prost 由 tonic-build 生成的 proto 代码间接使用
# （include_proto! 展开后引用 prost 类型），静态分析看不到，保留。
[package.metadata.cargo-machete]
ignored = ["prost"]
