[package]
name = "sisyphus-bridge-api"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared gRPC types, client wrapper, and server trait for the Sisyphus Bridge protocol"

[dependencies]
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
anyhow = { workspace = true }

[build-dependencies]
tonic-build = "0.12"
