[package]
name = "sisyphus-bridge-api"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared gRPC types, client wrapper, and server trait for the Sisyphus Bridge protocol"

[dependencies]
metrics = "0.24"
tonic = { version = "0.12", features = ["transport"] }
prost = "0.13"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
anyhow = { workspace = true }
serde_json = { workspace = true }
tokio-stream = "0.1"
futures = "0.3"

[build-dependencies]
tonic-build = "0.12"
