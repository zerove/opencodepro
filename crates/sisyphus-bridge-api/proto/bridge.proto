syntax = "proto3";

package sisyphus.bridge;

service SisyphusBridge {
  rpc ExecuteSOP (ExecuteSOPRequest) returns (SOPResponse);
  rpc HealthCheck (HealthCheckRequest) returns (HealthCheckResponse);
  rpc ListSOPs (ListSOPsRequest) returns (ListSOPsResponse);
  rpc StreamExecution (ExecuteSOPRequest) returns (stream ExecutionEvent);

  // Tool execution — direct access to the ExecutorRouter.
  // tool_id supports all builtin tools (file_*, glob, grep, bash_exec,
  // web_search, web_fetch) and agent tools (librarian/*, metis/*, momus/*).
  rpc ExecuteTool (ExecuteToolRequest) returns (ExecuteToolResponse);

  // Agent discovery — list registered agents and their metadata.
  rpc ListAgents (ListAgentsRequest) returns (ListAgentsResponse);

  // Tool discovery — list all registered tools with metadata.
  rpc ListTools (ListToolsRequest) returns (ListToolsResponse);

  // Team goal decomposition — LLM-based task DAG generation.
  rpc DecomposeGoal (DecomposeGoalRequest) returns (DecomposeGoalResponse);

  // Cognitive delegation — high-order reasoning and structured plan generation for external agents.
  rpc DelegateCognitiveTask (DelegateCognitiveTaskRequest) returns (DelegateCognitiveTaskResponse);
  rpc StreamCognitiveTask (DelegateCognitiveTaskRequest) returns (stream CognitiveTaskEvent);
  rpc SubmitFeedback (SubmitFeedbackRequest) returns (SubmitFeedbackResponse);
  rpc CaptureExperience (CaptureExperienceRequest) returns (CaptureExperienceResponse);



  // Skill management — list, inspect, install, and remove skills.
  rpc ListSkills (ListSkillsRequest) returns (ListSkillsResponse);
  rpc ShowSkill (ShowSkillRequest) returns (ShowSkillResponse);
  rpc InstallSkill (InstallSkillRequest) returns (InstallSkillResponse);
  rpc RemoveSkill (RemoveSkillRequest) returns (RemoveSkillResponse);

  // ... (rest of the services)

  // Benchmark monitoring — cognitive loop performance trends.
  rpc ListBenchmarks (ListBenchmarksRequest) returns (ListBenchmarksResponse);

  // Circuit breaker status — model-level failure protection state.
  rpc GetBreakerMetrics (BreakerMetricsRequest) returns (BreakerMetricsResponse);

  // Meta-learning insights — strategy performance analysis from historical execution data.
  rpc GetLearningInsights (LearningInsightsRequest) returns (LearningInsightsResponse);
  
  // Session interaction — add messages and trigger agent responses.
  rpc AddMessage (AddMessageRequest) returns (AddMessageResponse);
  
  // Workspace management — lifecycle and switching of project environments.
  rpc CreateWorkspace (CreateWorkspaceRequest) returns (CreateWorkspaceResponse);
  rpc SwitchWorkspace (SwitchWorkspaceRequest) returns (SwitchWorkspaceResponse);
  rpc ListWorkspaces (ListWorkspacesRequest) returns (ListWorkspacesResponse);
  rpc GetCurrentWorkspace (GetCurrentWorkspaceRequest) returns (GetCurrentWorkspaceResponse);
  rpc DeleteWorkspace (DeleteWorkspaceRequest) returns (DeleteWorkspaceResponse);

  // Plugin management — list, load, and unload WASM plugins at runtime.
  rpc ListPlugins (ListPluginsRequest) returns (ListPluginsResponse);
  rpc LoadPlugin (LoadPluginRequest) returns (LoadPluginResponse);
  rpc UnloadPlugin (UnloadPluginRequest) returns (UnloadPluginResponse);

  // TUI State synchronization — push updates for sessions, todos, and background operations.
  rpc CallJcode (CallJcodeRequest) returns (CallJcodeResponse);
  rpc StreamEvents (EventRequest) returns (stream BridgeEvent);

  // Chaos Engineering — fault injection experiments.
  rpc StartChaos (ChaosStartRequest) returns (ChaosStartResponse);
  rpc StopChaos (ChaosStopRequest) returns (ChaosStopResponse);
  rpc GetChaosStatus (ChaosStatusRequest) returns (ChaosStatusResponse);

  // Anomaly Detection — runtime cognitive loop health.
  rpc StreamAnomalyReport (AnomalyRequest) returns (stream AnomalyReport);
}

message ListAgentsRequest {}

message ListAgentsResponse {
  repeated AgentMetadata agents = 1;
}

message AgentMetadata {
  string agent_id = 1;
  string display_name = 2;
  string description = 3;
  repeated string tool_prefixes = 4;
  uint32 max_concurrency = 5;
}

message ListToolsRequest {}

message ListToolsResponse {
  repeated ToolMetadata tools = 1;
}

message ToolMetadata {
  string tool_id = 1;
  string name = 2;
  string description = 3;
  string source = 4;           // "builtin", "mcp", "strategic", "wasm"
  string parameters_json = 5;  // JSON Schema; empty if unavailable
}

message DecomposeGoalRequest {
  string goal_id = 1;
  string objective = 2;
  string context = 3;       // empty = no context
}

message DecomposeGoalResponse {
  bool success = 1;
  string error = 2;
  repeated TaskProto tasks = 3;
}

message DelegateCognitiveTaskRequest {
  string goal = 1;
  string context = 2;
}

message DelegateCognitiveTaskResponse {
  bool success = 1;
  string error = 2;
  string plan_json = 3; // Serialized CognitivePlan
}

message SubmitFeedbackRequest {
  string feedback_json = 1; // Serialized ExecutionFeedback
}

message SubmitFeedbackResponse {
  bool success = 1;
  string error = 2;
  string evolution_json = 3; // Serialized EvolutionResponse
}

message CaptureExperienceRequest {
  string plan_id = 1;
  string plan_json = 2; // The final successful CognitivePlan
}

message CaptureExperienceResponse {
  bool success = 1;
  string error = 2;
}

message TaskProto {
  string id = 1;
  string agent_id = 2;
  string tool_id = 3;
  string args_json = 4;
  repeated string depends_on = 5;
}

message ExecuteToolRequest {
  string tool_id = 1;      // e.g. "librarian/research", "metis/analyse"
  string args_json = 2;    // JSON-encoded arguments (see mdBook crates/tools.md for schemas)
  uint64 fuel_limit = 3;   // max execution units (0 = default)
}

message ExecuteToolResponse {
  string status = 1;       // "SUCCESS" or error message
  string result_json = 2;  // JSON-encoded result
}

message ExecuteSOPRequest {
  string sop_id = 1;
  map<string, string> args = 2;
}

message SOPResponse {
  string status = 1;
  string result = 2;
}

message HealthCheckRequest {}

message HealthCheckResponse {
  string status = 1;
  string version = 2;
}

message ListSOPsRequest {}

message ListSOPsResponse {
  repeated SOPInfo sops = 1;
}

message SOPInfo {
  string sop_id = 1;
  uint64 created_at = 2;
  uint32 node_count = 3;
}

message ExecutionEvent {
  enum EventType {
    NODE_STARTED = 0;
    NODE_COMPLETED = 1;
    NODE_FAILED = 2;
    EXECUTION_COMPLETE = 3;
  }
  EventType event_type = 1;
  string node_name = 2;
  string status = 3;
  string message = 4;
  uint64 timestamp = 5;
}

// ── Skill Management ──────────────────────────────────────

message ListSkillsRequest {
  bool remote = 1; // true to fetch from remote registry, false for local installed skills
}

message ListSkillsResponse {
  repeated SkillMetadata skills = 1;
}

message ShowSkillRequest {
  string name = 1;
}

message ShowSkillResponse {
  bool found = 1;
  SkillMetadata skill = 2;
}

message InstallSkillRequest {
  string skill_id = 1;   // ID of the skill in the remote registry
}

message InstallSkillResponse {
  bool success = 1;
  string error = 2;
  string name = 3;          // installed skill name
}

message RemoveSkillRequest {
  string name = 1;
}

message RemoveSkillResponse {
  bool success = 1;
  string error = 2;
}

message SkillMetadata {
  string id = 1;
  string name = 2;
  string description = 3;
  string version = 4;
  string author = 5;
  repeated string tags = 6;
  uint64 created_at = 7;
}

// ── Benchmark Monitoring ──────────────────────────────────

message ListBenchmarksRequest {
  string name_filter = 1;  // optional: filter by benchmark name prefix
}

message ListBenchmarksResponse {
  repeated BenchmarkEntry benchmarks = 1;
}

message BenchmarkEntry {
  string name = 1;
  double duration_secs = 2;
  uint64 timestamp = 3;
  bool success = 4;
  string metrics_json = 5;
}

// ── Circuit Breaker Status ─────────────────────────────────

message BreakerMetricsRequest {
  string model_name = 1;  // empty = all models
}

message BreakerMetricsResponse {
  repeated BreakerStatus breakers = 1;
}

message BreakerStatus {
  string model_name = 1;
  string state = 2;
  uint32 failure_count = 3;
  uint32 success_count = 4;
}

// ── Meta-Learning Insights ──────────────────────────────────

message LearningInsightsRequest {
  string strategy_filter = 1;  // optional: filter by strategy name
}

message LearningInsightsResponse {
  uint64 total_samples = 1;
  double overall_success_rate = 2;
  repeated StrategyInsight strategies = 3;
}

message StrategyInsight {
  string strategy = 1;
  uint64 total_uses = 2;
  uint64 successes = 3;
  uint64 failures = 4;
  double avg_duration_secs = 5;
  double success_rate = 6;
}

// ── Plugin Management ───────────────────────────────────────

message ListPluginsRequest {}

message ListPluginsResponse {
  repeated PluginDescriptor plugins = 1;
}

message LoadPluginRequest {
  string name = 1;
  string version = 2;
  string wasm_path = 3;
  string tool_id = 4;
  uint64 fuel_limit = 5;     // optional, 0 = default
}

message LoadPluginResponse {
  bool success = 1;
  string error = 2;
}

message UnloadPluginRequest {
  string name = 1;
}

message UnloadPluginResponse {
  bool success = 1;
  string error = 2;
}

message PluginDescriptor {
  string name = 1;
  string version = 2;
  string wasm_path = 3;
  string tool_id = 4;
  uint64 fuel_limit = 5;
  string checksum = 6;       // SHA-256 hex; empty if not computed
}

// ── Workspace Management ──────────────────────────────────────
message CreateWorkspaceRequest {
  string name = 1;
  string project_id = 2;
  string root_dir = 3;
}

message CreateWorkspaceResponse {
  bool success = 1;
  string error = 2;
  string workspace_id = 3;
}

message SwitchWorkspaceRequest {
  string workspace_id = 1;
}

message SwitchWorkspaceResponse {
  bool success = 1;
  string error = 2;
}

message ListWorkspacesRequest {}

message ListWorkspacesResponse {
  repeated WorkspaceMetadata workspaces = 1;
}

message GetCurrentWorkspaceRequest {}

message GetCurrentWorkspaceResponse {
  bool found = 1;
  WorkspaceMetadata workspace = 2;
}

message DeleteWorkspaceRequest {
  string workspace_id = 1;
}

message DeleteWorkspaceResponse {
  bool success = 1;
  string error = 2;
}

message WorkspaceMetadata {
  string id = 1;
  string name = 2;
  string project_id = 3;
  string root_dir = 4;
}

message AddMessageRequest {
  string session_id = 1;
  string role = 2;
  string content = 3;
  string session_db_path = 4;
}

message AddMessageResponse {
  bool success = 1;
  string error = 2;
  string response_content = 3;
}

message CognitiveTaskEvent {
  enum EventType {
    PREDICT = 0;
    EXECUTE = 1;
    REFLECT = 2;
    EVOLVE = 3;
    COMPLETE = 4;
    VERIFY = 5;
  }
  EventType event_type = 1;
  string payload = 2;
  uint64 timestamp = 3;
}

message EventRequest {}

message BridgeEvent {
  oneof event {
    SessionUpdate session_update = 1;
    TodoUpdate todo_update = 2;
    OperationUpdate op_update = 3;
    LogUpdate log_update = 4;
  }
}

message SessionUpdate {
  string session_id = 1;
  bool force_refresh = 2;
}

message TodoUpdate {
  bool force_refresh = 1;
}

message OperationUpdate {
  string op_id = 1;
  string status = 2;
  string result = 3;
  bool success = 4;
}

message LogUpdate {
  string message = 1;
  string level = 2; // "INFO", "WARN", "ERROR", "SUCCESS"
}

message CallJcodeRequest {
  string task_id = 1;
  string goal = 2;
  string context_json = 3;
}

message CallJcodeResponse {
  bool success = 1;
  string result = 2;
  string error = 3;
}

// ── Chaos Engineering ──────────────────────────────────────
message ChaosStartRequest {
  string name = 1;
  repeated string fault_types = 2;
  double fault_probability = 3;
  uint64 duration_seconds = 4;
  repeated string target_operations = 5;
}

message ChaosStartResponse {
  bool success = 1;
  string experiment_id = 2;
  string error = 3;
}

message ChaosStopRequest {
  string experiment_id = 1;
}

message ChaosStopResponse {
  bool success = 1;
  ChaosExperimentResult result = 2;
  string error = 3;
}

message ChaosStatusRequest {
  string experiment_id = 1;
}

message ChaosStatusResponse {
  bool running = 1;
  ChaosExperimentResult result = 2;
}

message ChaosExperimentResult {
  string name = 1;
  uint64 operations_attempted = 2;
  uint64 operations_succeeded = 3;
  uint64 operations_failed = 4;
  uint64 faults_injected = 5;
  double success_rate = 6;
}

// ── Anomaly Detection ──────────────────────────────────────
message AnomalyRequest {
  string sop_id = 1;
}

message AnomalyReport {
  string node_name = 1;
  string severity = 2;
  string metric = 3;
  double observed = 4;
  double expected = 5;
  string description = 6;
  uint64 timestamp = 7;
}
