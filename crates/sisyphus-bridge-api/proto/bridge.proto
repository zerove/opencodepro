syntax = "proto3";

package sisyphus.bridge;

service SisyphusBridge {
  rpc ExecuteSOP (ExecuteSOPRequest) returns (SOPResponse);
  rpc HealthCheck (HealthCheckRequest) returns (HealthCheckResponse);
  rpc ListSOPs (ListSOPsRequest) returns (ListSOPsResponse);
  rpc StreamExecution (ExecuteSOPRequest) returns (stream ExecutionEvent);

  // Tool execution — direct access to the ExecutorRouter.
  // tool_id supports all builtin tools (file_*, glob, grep, bash_exec,
  // web_search, web_fetch) and agent tools (librarian/*, metis/*, momus/*).
  rpc ExecuteTool (ExecuteToolRequest) returns (ExecuteToolResponse);

  // Agent discovery — list registered agents and their metadata.
  rpc ListAgents (ListAgentsRequest) returns (ListAgentsResponse);

  // Tool discovery — list all registered tools with metadata.
  rpc ListTools (ListToolsRequest) returns (ListToolsResponse);

  // Team goal decomposition — LLM-based task DAG generation.
  rpc DecomposeGoal (DecomposeGoalRequest) returns (DecomposeGoalResponse);

  // Skill management — list, inspect, install, and remove skills.
  rpc ListSkills (ListSkillsRequest) returns (ListSkillsResponse);
  rpc ShowSkill (ShowSkillRequest) returns (ShowSkillResponse);
  rpc InstallSkill (InstallSkillRequest) returns (InstallSkillResponse);
  rpc RemoveSkill (RemoveSkillRequest) returns (RemoveSkillResponse);

  // Benchmark monitoring — cognitive loop performance trends.
  rpc ListBenchmarks (ListBenchmarksRequest) returns (ListBenchmarksResponse);

  // Circuit breaker status — model-level failure protection state.
  rpc GetBreakerMetrics (BreakerMetricsRequest) returns (BreakerMetricsResponse);

  // Meta-learning insights — strategy performance analysis from historical execution data.
  rpc GetLearningInsights (LearningInsightsRequest) returns (LearningInsightsResponse);
  
  // Session interaction — add messages and trigger agent responses.
  rpc AddMessage (AddMessageRequest) returns (AddMessageResponse);

  // Plugin management — list, load, and unload WASM plugins at runtime.
  rpc ListPlugins (ListPluginsRequest) returns (ListPluginsResponse);
  rpc LoadPlugin (LoadPluginRequest) returns (LoadPluginResponse);
  rpc UnloadPlugin (UnloadPluginRequest) returns (UnloadPluginResponse);
}

message ListAgentsRequest {}

message ListAgentsResponse {
  repeated AgentMetadata agents = 1;
}

message AgentMetadata {
  string agent_id = 1;
  string display_name = 2;
  string description = 3;
  repeated string tool_prefixes = 4;
  uint32 max_concurrency = 5;
}

message ListToolsRequest {}

message ListToolsResponse {
  repeated ToolMetadata tools = 1;
}

message ToolMetadata {
  string tool_id = 1;
  string name = 2;
  string description = 3;
  string source = 4;           // "builtin", "mcp", "strategic", "wasm"
  string parameters_json = 5;  // JSON Schema; empty if unavailable
}

message DecomposeGoalRequest {
  string goal_id = 1;
  string objective = 2;
  string context = 3;       // empty = no context
}

message DecomposeGoalResponse {
  bool success = 1;
  string error = 2;
  repeated TaskProto tasks = 3;
}

message TaskProto {
  string id = 1;
  string agent_id = 2;
  string tool_id = 3;
  string args_json = 4;
  repeated string depends_on = 5;
}

message ExecuteToolRequest {
  string tool_id = 1;      // e.g. "librarian/research", "metis/analyse"
  string args_json = 2;    // JSON-encoded arguments (see mdBook crates/tools.md for schemas)
  uint64 fuel_limit = 3;   // max execution units (0 = default)
}

message ExecuteToolResponse {
  string status = 1;       // "SUCCESS" or error message
  string result_json = 2;  // JSON-encoded result
}

message ExecuteSOPRequest {
  string sop_id = 1;
  map<string, string> args = 2;
}

message SOPResponse {
  string status = 1;
  string result = 2;
}

message HealthCheckRequest {}

message HealthCheckResponse {
  string status = 1;
  string version = 2;
}

message ListSOPsRequest {}

message ListSOPsResponse {
  repeated SOPInfo sops = 1;
}

message SOPInfo {
  string sop_id = 1;
  uint64 created_at = 2;
  uint32 node_count = 3;
}

message ExecutionEvent {
  enum EventType {
    NODE_STARTED = 0;
    NODE_COMPLETED = 1;
    NODE_FAILED = 2;
    EXECUTION_COMPLETE = 3;
  }
  EventType event_type = 1;
  string node_name = 2;
  string status = 3;
  string message = 4;
  uint64 timestamp = 5;
}

// ── Skill Management ──────────────────────────────────────

message ListSkillsRequest {}

message ListSkillsResponse {
  repeated SkillMetadata skills = 1;
}

message ShowSkillRequest {
  string name = 1;
}

message ShowSkillResponse {
  bool found = 1;
  SkillMetadata skill = 2;
}

message InstallSkillRequest {
  string source_path = 1;   // filesystem path to the SKILL.md file
}

message InstallSkillResponse {
  bool success = 1;
  string error = 2;
  string name = 3;          // installed skill name
}

message RemoveSkillRequest {
  string name = 1;
}

message RemoveSkillResponse {
  bool success = 1;
  string error = 2;
}

message SkillMetadata {
  string name = 1;
  string description = 2;
  string version = 3;
  string author = 4;
  repeated string tags = 5;
  repeated string tool_triggers = 6;  // tool IDs this skill activates for
  string instructions_preview = 7;    // first 200 chars of instructions
  string source = 8;                  // "builtin", "user", "project"
}

// ── Benchmark Monitoring ──────────────────────────────────

message ListBenchmarksRequest {
  string name_filter = 1;  // optional: filter by benchmark name prefix
}

message ListBenchmarksResponse {
  repeated BenchmarkEntry benchmarks = 1;
}

message BenchmarkEntry {
  string name = 1;
  double duration_secs = 2;
  uint64 timestamp = 3;
  bool success = 4;
  string metrics_json = 5;
}

// ── Circuit Breaker Status ─────────────────────────────────

message BreakerMetricsRequest {
  string model_name = 1;  // empty = all models
}

message BreakerMetricsResponse {
  repeated BreakerStatus breakers = 1;
}

message BreakerStatus {
  string model_name = 1;
  string state = 2;
  uint32 failure_count = 3;
  uint32 success_count = 4;
}

// ── Meta-Learning Insights ──────────────────────────────────

message LearningInsightsRequest {
  string strategy_filter = 1;  // optional: filter by strategy name
}

message LearningInsightsResponse {
  uint64 total_samples = 1;
  double overall_success_rate = 2;
  repeated StrategyInsight strategies = 3;
}

message StrategyInsight {
  string strategy = 1;
  uint64 total_uses = 2;
  uint64 successes = 3;
  uint64 failures = 4;
  double avg_duration_secs = 5;
  double success_rate = 6;
}

// ── Plugin Management ───────────────────────────────────────

message ListPluginsRequest {}

message ListPluginsResponse {
  repeated PluginDescriptor plugins = 1;
}

message LoadPluginRequest {
  string name = 1;
  string version = 2;
  string wasm_path = 3;
  string tool_id = 4;
  uint64 fuel_limit = 5;     // optional, 0 = default
}

message LoadPluginResponse {
  bool success = 1;
  string error = 2;
}

message UnloadPluginRequest {
  string name = 1;
}

message UnloadPluginResponse {
  bool success = 1;
  string error = 2;
}

message PluginDescriptor {
  string name = 1;
  string version = 2;
  string wasm_path = 3;
  string tool_id = 4;
  uint64 fuel_limit = 5;
  string checksum = 6;       // SHA-256 hex; empty if not computed
}

// ── Session Chat ─────────────────────────────────────────────

message AddMessageRequest {
  string session_id = 1;
  string role = 2;
  string content = 3;
  string session_db_path = 4;
}

message AddMessageResponse {
  bool success = 1;
  string error = 2;
  string response_content = 3;
}
