syntax = "proto3";

package sisyphus.cluster;

// Cluster service — multi-instance peer protocol (ADR-009 § 1)
//
// 设计要点:
// 1. Join 握手：节点启动时调用，告诉集群自己的 node_id + addr
// 2. Stream 双向流：长连接，传输 PeerJoined / PeerLeft / StateProposal / ExperienceSync 事件
// 3. mDNS 服务发现（_sisyphus-bridge._tcp.local）作为零配置发现
// 4. 静态配置 fallback: [cluster].peers = ["node-1:50051", ...] 用于 K8s 等多播受限环境
service Cluster {
  // 单次握手：节点启动时调用一次，告知自己的 node_id + 监听地址
  rpc Join (JoinRequest) returns (JoinResponse);

  // 双向流：建立后保持长连接，传输集群事件
  // 服务端推送 PeerJoined / PeerLeft / ExperienceSync
  // 客户端推送 StateProposal / ExperienceSync
  rpc Stream (stream ClusterEvent) returns (stream ClusterEvent);
}

// Join 请求
message JoinRequest {
  // 本节点唯一 ID（UUID 或 hostname-derived）
  string node_id = 1;
  // 本节点 gRPC 监听地址（其他节点连接此地址）
  string grpc_addr = 2;
  // 集群名（多套集群并存时区分）
  string cluster_name = 3;
}

// Join 响应：当前已知 peers 列表（含自己）
message JoinResponse {
  // 当前集群成员（含发起 Join 的节点本身）
  repeated PeerInfo peers = 1;
  // 当前 leader 节点 ID（字典序最小）
  string leader_id = 2;
}

// Peer 信息
message PeerInfo {
  string node_id = 1;
  string grpc_addr = 2;
  // 加入时间（Unix epoch seconds）
  int64 joined_at = 3;
}

// 集群事件（双向流的 payload）
message ClusterEvent {
  oneof event {
    PeerJoined peer_joined = 1;
    PeerLeft peer_left = 2;
    StateProposal state_proposal = 3;
    ExperienceSync experience_sync = 4;
    // ADR-010：dial 方发版本向量，请求对端补发差量。
    // 挂在既有双向流上，不新增 RPC。
    SyncRequest sync_request = 5;
    // ADR-010：peer 方发页尾标记，告知差量一页结束与翻页游标。
    SyncPageEnd sync_page_end = 6;
  }
}

// ADR-010：反熵补偿请求。由 **dial 方**（发起 Join 的一侧）发出。
//
// 经验同步事件是即发即失的：流建立前的广播永久丢失、断连期间的经验重连后
// 不会补回、新节点对既有经验一无所知。SyncRequest 让 dial 方按自己实际持有的
// 内容拉取差量，传输量正比于真实差量而与历史总量无关。
message SyncRequest {
  // ADR-011：dial 方每个 origin 的持有情况。
  //
  // 最初这里只有 (node_id → 最大 counter) 的 map，隐含前提是「持有的行构成
  // 1..=max 的连续前缀」。广播 Lagged 会在中间打洞而尾部照常抵达，此时
  // max 依旧很大，对端据此算出的差量为空，那个洞就永久留在库里。
  // 改为携带空洞列表后，「我有什么」才真正可表达。
  repeated OriginDigest origins = 3;

  // ADR-012：分页游标（最后一个已送达的主键）。空串表示从头开始。
  //
  // 取代已废弃的 `offset` 下标。下标是错的：差量集合每翻一页就缩短一次
  // （dial 方收到即持有，于是那些行从差量中消失，差量整体前移），
  // 按旧下标切片会跳过一批仍缺失的行，表现为差量跨 3 页以上时尾部静默丢失。
  // 游标由内容决定，差量如何变化都只影响「还剩多少条」，不影响「从哪一条继续」。
  string cursor = 4;

  // 已废弃，保留字段号不回收：老节点仍会发送它。忽略即可——服务端把
  // origins 为空的请求当作「请求全量」，对老节点的行为天然退化为正确。
  //
  // 老节点发来的 offset 服务端不再解释，一律按空游标从头回送：
  // 合并路径幂等，多发一轮只浪费带宽，不会造成错漏。
  map<string, uint64> vector_clock = 1 [deprecated = true];

  // 已废弃，保留字段号不回收。解释下标是 ADR-010 丢失尾部行的根因，
  // 见上方 `cursor` 的说明。服务端一律忽略它。
  uint64 offset = 2 [deprecated = true];
}

// ADR-011：单个 origin 的持有情况。
message OriginDigest {
  // 来源节点 id。
  string origin = 1;
  // 本地持有的最大 counter；0 表示一条都没有。
  uint64 max = 2;
  // 1..=max 之中本地缺失的 counter，升序。
  //
  // 正常节点恒为空（写入序号由 fetch_add 单调分配），所以常规传输量不受影响；
  // 只有真正发生丢失时才变长，而那正是需要修复的量。
  repeated uint64 holes = 3;
}

// ADR-010：反熵页尾标记。由 **peer 侧**（被 dial 的一方）在一页差量发完后
// 发出，告知 dial 方「本页结束、是否还有下一页、下一页从哪里开始」。
//
// 必需而非可选：差量页以普通 `ExperienceSync` 事件的形式发送，与实时广播在
// wire 上完全相同，dial 方无法从事件本身分辨二者。若靠 dial 方本地计数来猜
// 页边界，实时广播会被误计入页内，使游标偏移错乱并漏发整页差量。
message SyncPageEnd {
  // 还有更多页时为 true。
  bool more = 1;
  // 已废弃：不再被服务端填写。保留字段号不回收。
  uint64 next_offset = 2 [deprecated = true];
  // ADR-012：下一轮 SyncRequest 应携带的游标键（最后一个已送达主键）。
  //
  // 必需而非可选：dial 方无从自行推断自己该从哪里继续——差量集合在翻页
  // 期间会缩短，靠本地计数推测页边界会把实时广播误计入页内而错乱游标。
  string next_cursor = 4;
  // 本页实际回送的条数（仅用于日志）。
  uint32 delivered = 3;
}

// 新 peer 加入
message PeerJoined {
  PeerInfo peer = 1;
}

// peer 离开（graceful shutdown 或 TTL 过期）
message PeerLeft {
  string node_id = 1;
  // 离开原因（"shutdown" / "ttl_expired" / "removed"）
  string reason = 2;
}

// 状态变更提案（用于跨节点共识 / 配置同步）
message StateProposal {
  string key = 1;
  bytes value = 2;
  // Vector clock (CRDT) — 每个 node_id 的最近 seen version
  map<string, uint64> vector_clock = 3;
}

// Experience sync（CRDT 同步事件，TODO 8.3.2 + 8.3.1 集成）
message ExperienceSync {
  // exp_key: exp:{timestamp}:{origin}:{counter}
  string exp_key = 1;
  // CRDT version
  uint64 version = 2;
  // CRDT vector_clock (JSON-serialized BTreeMap)
  string vector_clock_json = 3;
  // 序列化 payload (ExperienceTuple JSON)
  bytes payload = 4;
}
