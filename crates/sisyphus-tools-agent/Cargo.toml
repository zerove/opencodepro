[package]
name = "sisyphus-tools-agent"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
sisyphus-tools-core = { version = "0.1.0", path = "../sisyphus-tools-core" }
sisyphus-tools-executor = { version = "0.1.0", path = "../sisyphus-tools-executor" }
sisyphus-tools-llm = { version = "0.1.0", path = "../sisyphus-tools-llm" }
sisyphus-tools-llm-tools = { version = "0.1.0", path = "../sisyphus-tools-llm-tools" }
sisyphus-tools-system = { version = "0.1.0", path = "../sisyphus-tools-system" }
sisyphus-types = { version = "0.1.0", path = "../sisyphus-types" }
sisyphus-mem = { version = "0.1.0", path = "../sisyphus-mem" }
tokio = { version = "1.0", features = ["process", "fs", "io-util", "time", "rt", "macros"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = "0.9"
toml = "0.8"
anyhow = { workspace = true }
reqwest = { version = "0.12", features = ["json"] }
tracing = { workspace = true }
metrics = "0.24"
async-trait = { workspace = true }
thiserror = { workspace = true }
uuid = { version = "1.23.4", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.0", features = ["macros", "rt"] }
