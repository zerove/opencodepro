[package]
name = "sisyphus-tools-agent"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
sisyphus-tools-core = { path = "../sisyphus-tools-core" }
sisyphus-tools-executor = { path = "../sisyphus-tools-executor" }
sisyphus-tools-llm = { path = "../sisyphus-tools-llm" }
sisyphus-tools-llm-tools = { path = "../sisyphus-tools-llm-tools" }
sisyphus-tools-system = { path = "../sisyphus-tools-system" }
sisyphus-types = { path = "../sisyphus-types" }
tokio = { version = "1.0", features = ["process", "fs", "io-util", "time", "rt", "macros"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.0", features = ["macros", "rt"] }
