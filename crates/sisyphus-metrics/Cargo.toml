[package]
name = "sisyphus-metrics"
version = "0.3.0"
edition = "2021"
repository.workspace = true
authors = ["Sisyphus Team"]
description = "Metrics and observability for Sisyphus cognitive engine"
license = "MIT"

[dependencies]
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json", "env-filter"] }
tracing-opentelemetry = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-semantic-conventions = { workspace = true, optional = true }
sisyphus-types = { version = "0.3.0", path = "../sisyphus-types" }
thiserror = { workspace = true }

[features]
default = []
otel = ["tracing-opentelemetry", "opentelemetry", "opentelemetry-otlp", "opentelemetry_sdk", "opentelemetry-semantic-conventions"]

[dev-dependencies]
proptest = "1.0"