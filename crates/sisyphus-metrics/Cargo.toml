[package]
name = "sisyphus-metrics"
version = "0.1.0"
edition = "2021"
authors = ["Sisyphus Team"]
description = "Metrics and observability for Sisyphus cognitive engine"
license = "MIT"

[dependencies]
metrics = "0.21"
metrics-exporter-prometheus = "0.13"
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json", "env-filter"] }
tracing-opentelemetry = { version = "0.30", optional = true }
opentelemetry = { version = "0.28", optional = true }
opentelemetry-otlp = { version = "0.28", optional = true }
opentelemetry_sdk = { version = "0.28", features = ["rt-tokio"], optional = true }
opentelemetry-semantic-conventions = { version = "0.28", optional = true }
sisyphus-types = { path = "../sisyphus-types" }
thiserror = { workspace = true }

[features]
default = []
otel = ["tracing-opentelemetry", "opentelemetry", "opentelemetry-otlp", "opentelemetry_sdk", "opentelemetry-semantic-conventions"]

[dev-dependencies]
proptest = "1.0"