[package]
name = "sisyphus-sandboxd"
version = "0.4.0"
edition = "2021"
repository.workspace = true
authors = ["Sisyphus Team"]
description = "Standalone WASM sandbox daemon (stdio JSON-line protocol)"
license = "MIT"

[build-dependencies]
wat = "1"

[dependencies]
tokio = { version = "1", features = ["full"] }
sisyphus-sandbox = { version = "0.4.0", path = "../sisyphus-sandbox" }
sisyphus-types = { version = "0.4.0", path = "../sisyphus-types" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
tempfile = "3"