[package]
name = "sisyphus-sandboxd"
version = "0.1.0"
edition = "2021"
authors = ["Sisyphus Team"]
description = "Standalone WASM sandbox daemon (stdio JSON-line protocol)"
license = "MIT"

[build-dependencies]
wat = "1"

[dependencies]
async-trait = { workspace = true }
tokio = { version = "1", features = ["full"] }
sisyphus-types = { path = "../sisyphus-types" }
sisyphus-metrics = { path = "../sisyphus-metrics" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
dashmap = "6.0"
sha2 = "0.10"
hex = "0.4"
wasmtime = { version = "47", default-features = false, features = ["cranelift", "pooling-allocator"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
tempfile = "3"