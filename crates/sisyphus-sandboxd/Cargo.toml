[package]
name = "sisyphus-sandboxd"
version = "0.1.0"
edition = "2021"
description = "Standalone WASM sandbox daemon — runs wasmtime in an isolated process"
license = "MIT"

[dependencies]
sisyphus-sandbox = { path = "../sisyphus-sandbox" }
sisyphus-types = { path = "../sisyphus-types" }
tokio = { version = "1", features = ["full"] }
serde_json = "1.0"
serde = { workspace = true, features = ["derive"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
