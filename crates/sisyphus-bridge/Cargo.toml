[package]
name = "sisyphus-bridge"
version = "0.1.0"
edition = "2021"
authors = ["Sisyphus Team"]
description = "gRPC bridge server for Sisyphus cognitive engine"
license = "MIT"

[dependencies]
sisyphus-bridge-api = { path = "../sisyphus-bridge-api" }
tonic = "0.12"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
sisyphus-types = { path = "../sisyphus-types" }
sisyphus-core = { path = "../sisyphus-core" }
sisyphus-sandbox = { path = "../sisyphus-sandbox", optional = true }
sisyphus-tools-core = { path = "../sisyphus-tools-core" }
sisyphus-tools-llm = { path = "../sisyphus-tools-llm" }
sisyphus-tools-system = { path = "../sisyphus-tools-system" }
sisyphus-tools-mcp = { path = "../sisyphus-tools-mcp" }
sisyphus-tools-session = { path = "../sisyphus-tools-session" }
sisyphus-tools-agent = { path = "../sisyphus-tools-agent" }
sisyphus-tools-executor = { path = "../sisyphus-tools-executor" }
sisyphus-tools-build = { path = "../sisyphus-tools-build" }
sisyphus-mem = { path = "../sisyphus-mem" }
sisyphus-intel = { path = "../sisyphus-intel" }
sisyphus-tools-llm-tools = { path = "../sisyphus-tools-llm-tools" }
sisyphus-metrics = { path = "../sisyphus-metrics" }
sisyphus-roadmap = { path = "../sisyphus-roadmap" }
serde_json = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures-util = "0.3"

# HTTP/REST API (axum 0.7 to match tonic's transitive dep)
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
serde = { workspace = true, features = ["derive"] }
parking_lot = "0.12.5"
uuid = { version = "1.0", features = ["v4", "serde"] }

# OpenTelemetry
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }
tracing-opentelemetry = { workspace = true }

# JWT Authentication
jsonwebtoken = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
async-stream = "0.3"

[features]
default = ["sandbox"]
sandbox = ["sisyphus-sandbox"]

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
