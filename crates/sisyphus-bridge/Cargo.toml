[package]
name = "sisyphus-bridge"
version = "0.1.0"
edition = "2021"
authors = ["Sisyphus Team"]
description = "gRPC bridge server for Sisyphus cognitive engine"
license = "MIT"

[dependencies]
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
sisyphus-types = { path = "../sisyphus-types" }
sisyphus-core = { path = "../sisyphus-core" }
sisyphus-sandbox = { path = "../sisyphus-sandbox" }
sisyphus-tools = { path = "../sisyphus-tools" }
sisyphus-mem = { path = "../sisyphus-mem" }
sisyphus-intel = { path = "../sisyphus-intel" }
sisyphus-metrics = { path = "../sisyphus-metrics" }
sisyphus-roadmap = { path = "../sisyphus-roadmap" }
serde_json = "1.0"
async-trait = "0.1"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]
tonic-build = "0.12"
