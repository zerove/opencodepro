[package]
name = "sisyphus-bridge"
version = "0.1.0"
edition = "2021"
authors = ["Sisyphus Team"]
description = "gRPC bridge server for Sisyphus cognitive engine"
license = "MIT"

[dependencies]
sisyphus-bridge-api = { path = "../sisyphus-bridge-api" }
tonic = "0.12"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
sisyphus-types = { path = "../sisyphus-types" }
sisyphus-core = { path = "../sisyphus-core" }
sisyphus-sandbox = { path = "../sisyphus-sandbox" }
sisyphus-tools = { path = "../sisyphus-tools" }
sisyphus-mem = { path = "../sisyphus-mem" }
sisyphus-intel = { path = "../sisyphus-intel" }
sisyphus-metrics = { path = "../sisyphus-metrics" }
sisyphus-roadmap = { path = "../sisyphus-roadmap" }
serde_json = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# HTTP/REST API (axum 0.7 to match tonic's transitive dep)
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { workspace = true, features = ["derive"] }
