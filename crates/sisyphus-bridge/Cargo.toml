[package]
name = "sisyphus-bridge"
version = "0.4.0"
edition = "2021"
repository.workspace = true
authors = ["Sisyphus Team"]
description = "gRPC bridge server for Sisyphus cognitive engine"
license = "MIT"

[dependencies]
sisyphus-bridge-api = { version = "0.4.0", path = "../sisyphus-bridge-api" }
tonic = { version = "0.12", features = ["tls"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
sisyphus-types = { version = "0.4.0", path = "../sisyphus-types" }
sisyphus-core = { version = "0.4.0", path = "../sisyphus-core" }
sisyphus-sandbox = { version = "0.4.0", path = "../sisyphus-sandbox", optional = true }
sisyphus-tools-core = { version = "0.4.0", path = "../sisyphus-tools-core" }
sisyphus-tools-llm = { version = "0.4.0", path = "../sisyphus-tools-llm" }
sisyphus-tools-system = { version = "0.4.0", path = "../sisyphus-tools-system" }
sisyphus-tools-mcp = { version = "0.4.0", path = "../sisyphus-tools-mcp" }
sisyphus-tools-session = { version = "0.4.0", path = "../sisyphus-tools-session" }
sisyphus-tools-agent = { version = "0.4.0", path = "../sisyphus-tools-agent" }
sisyphus-tools-executor = { version = "0.4.0", path = "../sisyphus-tools-executor" }
sisyphus-tools-build = { version = "0.4.0", path = "../sisyphus-tools-build" }
sisyphus-mem = { version = "0.4.0", path = "../sisyphus-mem" }
sisyphus-intel = { version = "0.4.0", path = "../sisyphus-intel" }
sisyphus-tools-llm-tools = { version = "0.4.0", path = "../sisyphus-tools-llm-tools" }
sisyphus-metrics = { version = "0.4.0", path = "../sisyphus-metrics" }
sisyphus-roadmap = { version = "0.4.0", path = "../sisyphus-roadmap" }
serde_json = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures-util = "0.3"

# HTTP/REST API (axum 0.7 to match tonic's transitive dep)
axum = "0.7"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
serde = { workspace = true, features = ["derive"] }
parking_lot = "0.12.5"
uuid = { version = "1.0", features = ["v4", "serde"] }

# OpenTelemetry
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }
tracing-opentelemetry = { workspace = true }

# JWT Authentication
jsonwebtoken = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
async-stream = "0.3"
mdns-sd = "0.21.1"
x509-parser = "0.16"
# ADR-019：显式选择 rustls CryptoProvider（依赖图可能同时启用 ring/aws-lc-rs，
# 不显式安装时 rustls 会在握手期 panic）；仅需 ring provider。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[features]
default = ["sandbox"]
sandbox = ["sisyphus-sandbox"]

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# cluster_integration.rs 的双节点经验同步用例需要为每个节点建内存库
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio-rustls"] }
rcgen = "0.13"
tempfile = "3"
