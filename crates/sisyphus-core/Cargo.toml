[package]
name = "sisyphus-core"
version = "0.1.0"
edition = "2021"
authors = ["Sisyphus Team"]
description = "Kernel orchestrator: DAG-based async SOP execution with predictive cognition"
license = "MIT"

[features]
default = ["sandbox"]
sandbox = ["sisyphus-sandbox"]

[dependencies]
petgraph = "0.6"
tokio = { version = "1", features = ["full"] }
async-trait = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
sisyphus-metrics = { path = "../sisyphus-metrics" }
sisyphus-sandbox = { path = "../sisyphus-sandbox", optional = true }
sisyphus-types = { path = "../sisyphus-types" }
sisyphus-mem = { path = "../sisyphus-mem" }
sisyphus-intel = { path = "../sisyphus-intel" }
sisyphus-tools = { path = "../sisyphus-tools" }
sisyphus-roadmap = { path = "../sisyphus-roadmap" }
thiserror = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }

[[bin]]
name = "integration_stress"
path = "src/bin/integration_stress.rs"
required-features = ["sandbox"]

[[bench]]
name = "core_benches"
harness = false
required-features = ["sandbox"]

