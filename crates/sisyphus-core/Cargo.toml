[package]
name = "sisyphus-core"
version = "0.3.0"
edition = "2021"
repository.workspace = true
authors = ["Sisyphus Team"]
description = "Kernel orchestrator: DAG-based async SOP execution with predictive cognition"
license = "MIT"

[features]
default = []
sandbox = ["sisyphus-sandbox"]

[dependencies]
petgraph = "0.6"
tokio = { version = "1", features = ["full"] }
async-trait = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tracing = { workspace = true, features = ["attributes"] }
sisyphus-metrics = { version = "0.3.0", path = "../sisyphus-metrics" }
sisyphus-sandbox = { version = "0.3.0", path = "../sisyphus-sandbox", optional = true }
sisyphus-types = { version = "0.3.0", path = "../sisyphus-types" }
sisyphus-mem = { version = "0.3.0", path = "../sisyphus-mem" }
sisyphus-intel = { version = "0.3.0", path = "../sisyphus-intel" }

sisyphus-roadmap = { version = "0.3.0", path = "../sisyphus-roadmap" }
futures = "0.3"
parking_lot = "0.12"
thiserror = { workspace = true }
dashmap = { workspace = true }
md5 = "0.8.0"
uuid = "1.23.5"
sisyphus-knowledge = { version = "0.3.0", path = "../sisyphus-knowledge" }
sisyphus_visual = { version = "0.3.0", path = "../sisyphus-visual" }

[dev-dependencies]
sisyphus-tools-llm-tools = { version = "0.3.0", path = "../sisyphus-tools-llm-tools" }
sisyphus-tools-executor = { version = "0.3.0", path = "../sisyphus-tools-executor" }
# Production code no longer depends on these; the test harness and benches
# still construct real executors and clients.
sisyphus-tools-system = { version = "0.3.0", path = "../sisyphus-tools-system" }
# In-crate test doubles: DummyLlmClient, DummyEmbeddingClient.
sisyphus-tools-llm = { version = "0.3.0", path = "../sisyphus-tools-llm" }

proptest = "1.4"
tracing-subscriber = "0.3"
criterion = { version = "0.5", features = ["async_tokio"] }
tempfile = "3.10"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls"] }

[[bin]]
name = "integration_stress"
path = "src/bin/integration_stress.rs"
required-features = ["sandbox"]

[[bench]]
name = "core_benches"
harness = false
required-features = ["sandbox"]

[[bench]]
name = "lightweight_benches"
harness = false
# 不依赖 sandbox，可在默认 feature 下运行
# 覆盖：AnomalyDetector / DagRenderer 等纯计算路径
