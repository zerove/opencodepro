[package]
name = "sisyphus-core"
version = "0.1.0"
edition = "2021"
authors = ["Sisyphus Team"]
description = "Kernel orchestrator: DAG-based async SOP execution with predictive cognition"
license = "MIT"

[features]
default = ["sandbox"]
sandbox = ["sisyphus-sandbox"]
broken_tests = []

[dependencies]
petgraph = "0.6"
tokio = { version = "1", features = ["full"] }
async-trait = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tracing = { workspace = true }
sisyphus-metrics = { path = "../sisyphus-metrics" }
sisyphus-sandbox = { path = "../sisyphus-sandbox", optional = true }
sisyphus-types = { path = "../sisyphus-types" }
sisyphus-mem = { path = "../sisyphus-mem" }
sisyphus-intel = { path = "../sisyphus-intel" }
sisyphus-tools-llm = { path = "../sisyphus-tools-llm" }
sisyphus-tools-llm-tools = { path = "../sisyphus-tools-llm-tools" }
sisyphus-tools-agent = { path = "../sisyphus-tools-agent" }


sisyphus-tools-system = { path = "../sisyphus-tools-system" }
   sisyphus-tools-executor = { path = "../sisyphus-tools-executor" }
sisyphus-tools-build = { path = "../sisyphus-tools-build" }
sisyphus-roadmap = { path = "../sisyphus-roadmap" }
   futures = "0.3"
parking_lot = "0.12"
thiserror = { workspace = true }
dashmap = { workspace = true }
md5 = "0.7"
uuid = "1.23.5"
sisyphus-knowledge = { version = "0.1.0", path = "../sisyphus-knowledge" }
sisyphus_visual = { version = "0.1.0", path = "../sisyphus-visual" }


[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
sisyphus-tools-llm = { path = "../sisyphus-tools-llm" }
tempfile = "3.10"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls"] }

[[bin]]
name = "integration_stress"
path = "src/bin/integration_stress.rs"
required-features = ["sandbox"]

[[bench]]
name = "core_benches"
harness = false
required-features = ["sandbox"]
