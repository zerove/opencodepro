[package]
name = "sisyphus-tools-llm"
version = "0.3.0"
edition = "2021"
repository.workspace = true
description = "LLM abstraction layer: client, provider registry, and request routing"
authors.workspace = true
license = "MIT OR Apache-2.0"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { version = "1.0", features = ["process", "fs", "io-util", "time", "rt", "rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tracing = { workspace = true }
sisyphus-types = { version = "0.3.0", path = "../sisyphus-types" }
sisyphus-tools-core = { version = "0.3.0", path = "../sisyphus-tools-core" }
parking_lot = "0.12"
metrics = "0.24"

[dev-dependencies]
tempfile = "3"
