[package]
name = "sisyphus-tools-system"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
async-trait = "0.1"
sisyphus-tools-core = { path = "../sisyphus-tools-core" }
sisyphus-types = { path = "../sisyphus-types" }
tokio = { version = "1.0", features = ["process", "fs", "io-util", "time", "rt", "macros"] }
glob = "0.3"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
toml = "0.8"
base64 = "0.22"
urlencoding = "2.1"
regex = "1.0"
ignore = "0.4"
tempfile = "3"
tracing = { workspace = true }
metrics = "0.24"
dashmap = { workspace = true }
