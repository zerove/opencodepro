[package]
name = "sisyphus-intel"
version = "0.1.0"
edition = "2021"

[dependencies]
sisyphus-types = { path = "../sisyphus-types" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
rand = { version = "0.8", features = ["small_rng"] }
rayon = "1.7"
tokio = { version = "1", features = ["full"] }
petgraph = "0.6"
