[package]
name = "sisyphus-intel"
version = "0.1.0"
edition = "2021"
authors = ["Sisyphus Team"]
description = "Cognitive loop: flow synthesis, Monte Carlo simulation, reflection, evolution"
license = "MIT"

[dependencies]
sisyphus-types = { path = "../sisyphus-types" }
sisyphus-metrics = { path = "../sisyphus-metrics" }
	sisyphus-tools-llm = { path = "../sisyphus-tools-llm" }
sisyphus-tools-llm-tools = { path = "../sisyphus-tools-llm-tools" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
async-trait = { workspace = true }
rand = { version = "0.8", features = ["small_rng"] }
rayon = "1.7"
tokio = { version = "1", features = ["full"] }
petgraph = "0.6"
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "cognitive_benches"
harness = false
