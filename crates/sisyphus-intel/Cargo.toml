[package]
name = "sisyphus-intel"
version = "0.1.0"
edition = "2021"
authors = ["Sisyphus Team"]
description = "Cognitive loop: flow synthesis, Monte Carlo simulation, reflection, evolution"
license = "MIT"

[dependencies]
sisyphus-types = { version = "0.1.0", path = "../sisyphus-types" }
sisyphus-metrics = { version = "0.1.0", path = "../sisyphus-metrics" }
sisyphus-tools-llm = { version = "0.1.0", path = "../sisyphus-tools-llm" }
sisyphus-tools-llm-tools = { version = "0.1.0", path = "../sisyphus-tools-llm-tools" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
md5 = "0.8.0"
async-trait = { workspace = true }
rand = { version = "0.8", features = ["small_rng"] }
rayon = "1.7"
tokio = { version = "1", features = ["full"] }
petgraph = "0.6"
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = "0.12.5"
tempfile = "3.8"
uuid = { version = "1.4", features = ["v4"] }
proptest = { version = "1.4", features = ["std"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "cognitive_benches"
harness = false
