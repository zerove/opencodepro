[package]
name = "sisyphus-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "sisyphus_cli"
path = "src/lib.rs"

[[bin]]
name = "sisyphus"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sisyphus-types = { path = "../sisyphus-types" }
sisyphus-tools-agent = { path = "../sisyphus-tools-agent" }
sisyphus-tools-build = { path = "../sisyphus-tools-build" }
sisyphus-tools-core = { path = "../sisyphus-tools-core" }
sisyphus-tools-llm = { path = "../sisyphus-tools-llm" }
sisyphus-tools-llm-tools = { path = "../sisyphus-tools-llm-tools" }
sisyphus-tools-system = { path = "../sisyphus-tools-system" }
sisyphus-tools-scm = { path = "../sisyphus-tools-scm" }
sisyphus-tools-mcp = { path = "../sisyphus-tools-mcp" }
sisyphus-tools-session = { path = "../sisyphus-tools-session" }
sisyphus-tools-executor = { path = "../sisyphus-tools-executor" }
clap = { version = "4.5", features = ["derive", "env"] }
ratatui = "0.28"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1.0", features = ["full"] }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
metrics = "0.24"
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tonic = "0.12"
tokio-stream = "0.1"
reqwest = { version = "0.12", features = ["json"] }
glob = "0.3"
arboard = "3.4"
base64 = "0.22"
unicode-width = "0.1"
sisyphus-bridge-api = { path = "../sisyphus-bridge-api" }
futures = "0.3"
uuid = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
assert_cmd = "2"
