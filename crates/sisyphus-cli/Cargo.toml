[package]
name = "sisyphus-cli"
version = "0.1.0"
edition = "2021"

[lib]
name = "sisyphus_cli"
path = "src/lib.rs"

[[bin]]
name = "sisyphus"
path = "src/main.rs"

[dependencies]
sisyphus-types = { path = "../sisyphus-types" }
sisyphus-tools = { path = "../sisyphus-tools" }
sisyphus-sandbox = { path = "../sisyphus-sandbox" }
clap = { version = "4.5", features = ["derive", "env"] }
ratatui = "0.28"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tonic = "0.12"
prost = "0.13"
tokio-stream = "0.1"
glob = "0.3"

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
assert_cmd = "2"