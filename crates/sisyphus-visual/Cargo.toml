[package]
name = "sisyphus_visual"
version = "0.1.0"
edition = "2021"

[dependencies]
sisyphus-types = { path = "../sisyphus-types" }
sisyphus-intel = { path = "../sisyphus-intel" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
thiserror = "1.0"
anyhow = "1.0"
sisyphus-tools-llm = { version = "0.1.0", path = "../sisyphus-tools-llm" }
tracing.workspace = true
reqwest = { version = "0.12", features = ["json"] }
