[package]
name = "sisyphus-types"
version = "0.3.0"
edition = "2021"
repository.workspace = true
authors = ["Sisyphus Team"]
description = "Core types and traits for Sisyphus cognitive engine"
license = "MIT"

[dependencies]
async-trait = { workspace = true }
petgraph = "0.6"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = "0.8"
thiserror = { workspace = true }
tracing = { workspace = true }
metrics = "0.24"
# imbl: API 兼容 fork of im (maintained); 修复 RUSTSEC-2026-0247/0248/0251 + 2023-0126
imbl = { version = "2", features = ["serde"] }
dashmap = "6.1"
notify = "6.0"
tokio = { version = "1.0", features = ["rt", "macros", "sync", "fs", "time"] }

[dev-dependencies]
proptest = "1"
tokio = { version = "1.0", features = ["rt", "macros", "time"] }
tempfile = "3"

