[package]
name = "sisyphus-types"
version = "0.1.0"
edition = "2021"
authors = ["Sisyphus Team"]
description = "Core types and traits for Sisyphus cognitive engine"
license = "MIT"

[dependencies]
async-trait = { workspace = true }
petgraph = "0.6"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = "0.8"
thiserror = { workspace = true }
tracing = { workspace = true }
im = { version = "15.1.0", features = ["serde"] }
dashmap = "6.1"

[dev-dependencies]
proptest = "1"
tokio = { version = "1.0", features = ["rt", "macros"] }

