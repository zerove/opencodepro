[package]
name = "sisyphus-types"
version = "0.1.0"
edition = "2021"
authors = ["Sisyphus Team"]
description = "Core types and traits for Sisyphus cognitive engine"
license = "MIT"

[dependencies]
async-trait = "0.1"
petgraph = "0.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"

[dev-dependencies]
proptest = "1"
tokio = { version = "1.0", features = ["rt", "macros"] }

