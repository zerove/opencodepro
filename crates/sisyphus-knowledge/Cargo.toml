[package]
name = "sisyphus-knowledge"
version = "0.4.0"
edition = "2021"
repository.workspace = true
description = "Knowledge graph and cognitive asset management"
authors.workspace = true
license = "MIT OR Apache-2.0"

[lib]
name = "sisyphus_knowledge"
path = "src/lib.rs"

[dependencies]
sisyphus-types = { version = "0.4.0", path = "../sisyphus-types" }
sisyphus-intel = { version = "0.4.0", path = "../sisyphus-intel" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4"] }
petgraph = "0.6"
anyhow = "1.0"
metrics = "0.24"
sisyphus-tools-llm = { version = "0.4.0", path = "../sisyphus-tools-llm" }

[dev-dependencies]
tempfile = "3"
