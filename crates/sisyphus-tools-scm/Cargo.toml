[package]
name = "sisyphus-tools-scm"
version = "0.2.0"
edition = "2021"
repository.workspace = true
description = "Source control (git) tools"
authors.workspace = true
license = "MIT OR Apache-2.0"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
metrics = "0.24"
tempfile = "3"
chrono = "0.4"
# serde_yaml 0.9 上游已 deprecated，其 unsafe-libyaml 依赖被标记 unmaintained
# (RUSTSEC-2024-0449)。serde_norway 是维护中的 fork，API 与 0.9 兼容，
# 用 package 别名迁移后业务代码无需改动。
serde_yaml = { package = "serde_norway", version = "0.9" }
sisyphus-tools-core = { version = "0.2.0", path = "../sisyphus-tools-core" }
