[package]
name = "sisyphus-tools-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1.0", features = ["process", "fs", "io-util", "time", "rt", "macros"] }
tracing = { workspace = true }
sisyphus-types = { path = "../sisyphus-types" }
tonic = "0.12"
sisyphus-bridge-api = { path = "../sisyphus-bridge-api" }
