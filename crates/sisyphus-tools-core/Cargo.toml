[package]
name = "sisyphus-tools-core"
version = "0.3.0"
edition = "2021"
repository.workspace = true
description = "Shared tool primitives: ToolError, permissions, feedback store, and subprocess runner"
authors.workspace = true
license = "MIT OR Apache-2.0"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1.0", features = ["process", "fs", "io-util", "time", "rt", "macros"] }
tracing = { workspace = true }
sisyphus-types = { version = "0.3.0", path = "../sisyphus-types" }

[dev-dependencies]
tempfile = "3"
