[package]
name = "sisyphus-tools-executor"
version = "0.1.0"
edition = "2021"

[dependencies]
sisyphus-tools-core = { path = "../sisyphus-tools-core" }
sisyphus-tools-mcp = { path = "../sisyphus-tools-mcp" }
sisyphus-tools-llm = { path = "../sisyphus-tools-llm" }
sisyphus-tools-llm-tools = { path = "../sisyphus-tools-llm-tools" }
sisyphus-tools-system = { path = "../sisyphus-tools-system" }
sisyphus-bridge-api = { path = "../sisyphus-bridge-api" }
sisyphus-types = { path = "../sisyphus-types" }
tokio = { version = "1.0", features = ["process", "fs", "io-util", "time", "rt", "macros"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
base64 = "0.22"
chrono = "0.4"
urlencoding = "2.1"

[dev-dependencies]
tempfile = "3"
base64 = "0.22"
chrono = "0.4"
urlencoding = "2.1"
