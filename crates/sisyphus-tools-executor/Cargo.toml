[package]
name = "sisyphus-tools-executor"
version = "0.3.0"
edition = "2021"
repository.workspace = true
description = "Task execution and scheduling tools"
authors.workspace = true
license = "MIT OR Apache-2.0"

[dependencies]
sisyphus-tools-core = { version = "0.3.0", path = "../sisyphus-tools-core" }
sisyphus-tools-mcp = { version = "0.3.0", path = "../sisyphus-tools-mcp" }
sisyphus-tools-llm = { version = "0.3.0", path = "../sisyphus-tools-llm" }
sisyphus-tools-llm-tools = { version = "0.3.0", path = "../sisyphus-tools-llm-tools" }
sisyphus-tools-system = { version = "0.3.0", path = "../sisyphus-tools-system" }
sisyphus-bridge-api = { version = "0.3.0", path = "../sisyphus-bridge-api" }
sisyphus-types = { version = "0.3.0", path = "../sisyphus-types" }
tokio = { version = "1.0", features = ["process", "fs", "io-util", "time", "rt", "macros"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
base64 = "0.22"
chrono = "0.4"
urlencoding = "2.1"

metrics = "0.24"

[dev-dependencies]
tempfile = "3"
base64 = "0.22"
chrono = "0.4"
urlencoding = "2.1"
sisyphus-tools-session = { version = "0.3.0", path = "../sisyphus-tools-session" }
