[package]
name = "sisyphus-tools-session"
version = "0.4.1"
publish = false
edition = "2021"
repository.workspace = true
description = "Session management tools"
authors.workspace = true
license = "MIT OR Apache-2.0"

[dependencies]
sisyphus-tools-core = { version = "0.4.1", path = "../sisyphus-tools-core" }
sisyphus-types = { version = "0.4.1", path = "../sisyphus-types" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
metrics = "0.24"
# serde_yaml 0.9 上游已 deprecated，其 unsafe-libyaml 依赖被标记 unmaintained
# (RUSTSEC-2024-0449)。serde_norway 是维护中的 fork，API 与 0.9 兼容，
# 用 package 别名迁移后业务代码无需改动。
serde_yaml = { package = "serde_norway", version = "0.9" }

[dev-dependencies]
tempfile = "3"
