[package]
name = "sisyphus-tools-session"
version = "0.2.0"
edition = "2021"
repository.workspace = true
description = "Session management tools"
authors.workspace = true
license = "MIT OR Apache-2.0"

[dependencies]
sisyphus-tools-core = { version = "0.2.0", path = "../sisyphus-tools-core" }
sisyphus-types = { version = "0.2.0", path = "../sisyphus-types" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = "0.8"
tokio = { version = "1.0", features = ["process", "fs", "io-util", "time", "rt", "macros"] }
chrono = "0.4"
tracing = { workspace = true }
metrics = "0.24"
base64 = "0.22"
serde_yaml = "0.9"
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"
