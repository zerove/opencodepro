[package]
name = "sisyphus-tools-session"
version = "0.1.0"
edition = "2021"

[dependencies]
sisyphus-tools-core = { path = "../sisyphus-tools-core" }
sisyphus-types = { path = "../sisyphus-types" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = "0.8"
tokio = { version = "1.0", features = ["process", "fs", "io-util", "time", "rt", "macros"] }
chrono = "0.4"
tracing = { workspace = true }
base64 = "0.22"
serde_yaml = "0.9"
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"
