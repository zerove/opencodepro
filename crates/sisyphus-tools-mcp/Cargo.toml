[package]
name = "sisyphus-tools-mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
sisyphus-tools-core = { path = "../sisyphus-tools-core" }
sisyphus-types = { path = "../sisyphus-types" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { version = "1.0", features = ["process", "fs", "io-util", "time", "rt", "macros"] }
tracing = { workspace = true }
urlencoding = "2.1"
thiserror = { workspace = true }
async-trait = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
toml = "0.8"
