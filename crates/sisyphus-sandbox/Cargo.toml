[package]
name = "sisyphus-sandbox"
version = "0.2.0"
edition = "2021"
repository.workspace = true
authors = ["Sisyphus Team"]
description = "Wasmtime sandbox executor with fuel limits and module caching"
license = "MIT"

[build-dependencies]
wat = "1"

[dependencies]
async-trait = { workspace = true }
tokio = { version = "1", features = ["full"] }
sisyphus-types = { version = "0.2.0", path = "../sisyphus-types" }
sisyphus-metrics = { version = "0.2.0", path = "../sisyphus-metrics" }
serde_json = { workspace = true }
thiserror = { workspace = true }
dashmap = "6.0"
sha2 = "0.10"
hex = "0.4"
wasmtime = { version = "48", default-features = false, features = ["cranelift", "pooling-allocator"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
# proptest for SchemaValidator fuzzing (P2-7 推进：wasm 沙箱的 proptest 边界覆盖)
proptest = "1.4"
serde_json = { workspace = true }
