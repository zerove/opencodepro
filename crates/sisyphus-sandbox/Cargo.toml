[package]
name = "sisyphus-sandbox"
version = "0.1.0"
edition = "2021"
authors = ["Sisyphus Team"]
description = "Wasmtime sandbox executor with fuel limits and module caching"
license = "MIT"

[build-dependencies]
wat = "1"

[dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
sisyphus-types = { path = "../sisyphus-types" }
sisyphus-metrics = { path = "../sisyphus-metrics" }
dashmap = "6.0"
wasmtime = { version = "25", default-features = false, features = ["cranelift", "pooling-allocator"] }
tracing = { workspace = true }

