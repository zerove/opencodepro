[package]
name = "sisyphus-sandbox"
version = "0.1.0"
edition = "2021"
authors = ["Sisyphus Team"]
description = "Wasmtime sandbox executor with fuel limits and module caching"
license = "MIT"

[build-dependencies]
wat = "1"

[dependencies]
async-trait = { workspace = true }
tokio = { version = "1", features = ["full"] }
sisyphus-types = { path = "../sisyphus-types" }
sisyphus-metrics = { path = "../sisyphus-metrics" }
serde_json = { workspace = true }
thiserror = { workspace = true }
dashmap = "6.0"
sha2 = "0.10"
hex = "0.4"
wasmtime = { version = "47", default-features = false, features = ["cranelift", "pooling-allocator"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"


