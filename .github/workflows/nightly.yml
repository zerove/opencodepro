# ── Nightly Build ─────────────────────────────────────────────────────
# Runs daily at 00:00 UTC (or on-demand via workflow_dispatch).
# Builds CLI, sandboxd, and Docker image; publishes to GHCR.

name: Nightly

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  # 与 docker-release.yml 保持一致的字面量镜像名：`${{ github.repository }}` 展开成
  # `zerove/opencodepro`，推上去的包名和文档里所有 `docker pull .../sisyphus-bridge`
  # 都不是同一个包。scripts/audit_docker_release.py 会校验这处一致性。
  # owner 用表达式（fork 后仍指向自己的 registry），产品名必须是字面量。
  # ghcr 的镜像路径是 <registry>/<owner>/<name>，只写 name 会得到
  # `ghcr.io/sisyphus-bridge`——不是合法仓库路径，push 直接失败。
  IMAGE_NAME: ${{ github.repository_owner }}/sisyphus-bridge

permissions:
  contents: read
  packages: write

jobs:
  # ── Build CLI (Linux x86_64) ──────────────────────────────────────
  build-cli:
    timeout-minutes: 40
    name: Build CLI (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-protoc
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p sisyphus-cli
      - uses: actions/upload-artifact@v4
        with:
          name: sisyphus-cli-linux
          path: target/release/sisyphus
          retention-days: 7

  # ── Build Sandboxd (Linux x86_64) ─────────────────────────────────
  build-sandboxd:
    timeout-minutes: 40
    name: Build Sandboxd (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p sisyphus-sandboxd
      - uses: actions/upload-artifact@v4
        with:
          name: sisyphus-sandboxd-linux
          path: target/release/sisyphus-sandboxd
          retention-days: 7

  # ── Build CLI (macOS ARM64) ───────────────────────────────────────
  build-cli-macos:
    timeout-minutes: 40
    name: Build CLI (macOS ARM64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-apple-darwin
      - uses: ./.github/actions/setup-protoc
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p sisyphus-cli --target aarch64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: sisyphus-cli-macos-arm64
          path: target/aarch64-apple-darwin/release/sisyphus
          retention-days: 7

  # ── Build CLI (Windows x86_64) ────────────────────────────────────
  build-cli-windows:
    timeout-minutes: 40
    name: Build CLI (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-protoc
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p sisyphus-cli
      - uses: actions/upload-artifact@v4
        with:
          name: sisyphus-cli-windows
          path: target/release/sisyphus.exe
          retention-days: 7

  # ── Build & Push Docker Image ─────────────────────────────────────
  docker:
    timeout-minutes: 40
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [build-cli]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # 只推 nightly 专属 tag，**不动 `:latest`**：`docker pull :latest` 必须是
          # 最近一次稳定发布（docker-release.yml 的 flavor latest=auto）。两条流水线
          # 都写 `:latest` 时，用户拿到的到底是哪个版本取决于谁最后跑完。
          tags: |
            type=schedule,pattern=nightly-{{date 'YYYYMMDD'}}
            type=raw,value=nightly
            type=sha,prefix=nightly-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Golden SOP library structural evaluation (P3-10) ─────────────
  golden-sop-eval:
    timeout-minutes: 30
    name: Golden SOP Evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-protoc
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p eval-runner --bin golden-sop-eval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-sop-eval-log
          path: golden_sop_report.txt
          retention-days: 30

  # ── HTTP client performance regression check (ADR-006 §J) ─────────
  # 跑 shared_http bench，与 `.sisyphus/eval-history/` 上次基线对比。
  # 失败条件 (任一即 fail):
  #   - 共享模式加速比 < 1.5x (连接复用失效)
  #   - 相对上次基线 < 0.8x (性能回归 20%+)
  http-client-bench:
    timeout-minutes: 30
    name: HTTP Client Performance Bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 拉取历史 jsonl 当基线；fetch-depth 0 保留全部 commit
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-protoc
      - uses: Swatinem/rust-cache@v2
      - name: Run benchmark
        run: cargo run --release -p eval-runner --bin http-client-bench
        env:
          # 让 server 在 CI 安静运行（少 1-2s 启动时间）
          RUST_LOG: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: http-client-bench-report
          path: .sisyphus/eval-history/
          retention-days: 90

  # ── T3.3: TUI 首帧测量（伪终端，headless）────────────────────
  # 在 pty 中启动 TUI，命中首个面板绘制即记为首帧可见；
  # 与基线对比用同一口径（同一 bin 类型、同样本数）。
  tui-first-frame:
    timeout-minutes: 30
    name: TUI First-frame Measurement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-protoc
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI (debug)
        run: cargo build -p sisyphus-cli
      - name: Measure first frame (3 samples)
        run: ./scripts/measure-tui-first-frame.sh ./target/debug/sisyphus 3
      - name: TUI conversational-execution smoke
        run: ./scripts/tui-dev-smoke.sh ./target/debug/sisyphus
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tui-first-frame-report
          path: docs/benchmarks/tui-first-frame/
          retention-days: 30

  # ── T4.5: 长窗口稳定性监测（bridge 资源泄漏 / 句柄 / 线程）─────
  # 固定窗口采样 RSS / FD / 线程数，并周期性打只读端点；
  # 结论与原始采样一并归档为 artifact（不把未测时长外推成结论）。
  long-run-stability:
    timeout-minutes: 45
    name: Long-window Stability Monitor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      # bridge 依赖 sisyphus-bridge-api，其 build script 需要 protoc
      - uses: ./.github/actions/setup-protoc
      - uses: Swatinem/rust-cache@v2
      - name: Build bridge
        run: cargo build -p sisyphus-bridge
      - name: Monitor (10 minute window)
        run: ./scripts/long-run-stability.sh 10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: long-run-stability-report
          path: docs/benchmarks/long-run/
          retention-days: 30

  # ── T4.2: 性能回归门禁（定时采样对比基线阈值）────────────────
  perf-regression:
    timeout-minutes: 30
    name: Performance Regression Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-protoc
      - uses: Swatinem/rust-cache@v2
      - name: Check CLI metrics against baseline
        run: ./scripts/perf-regression-check.sh cli

  # ── ADR-007 §1 panic 检查 (Rust 实现, 纯 workspace 工具) ─────────
  # 跑 no-panic-check binary 对比 baseline, 新增 panic 即 fail。
  panic-check:
    timeout-minutes: 30
    name: ADR-007 §1 No-Panic Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-protoc
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build -p eval-runner --bin no-panic-check
      - name: Self-tests
        run: cargo test -p eval-runner --bin no-panic-check
      - name: Run no-panic-check vs baseline
        run: |
          cargo run -p eval-runner --bin no-panic-check --             --baseline .sisyphus/quality/panic-baseline.json crates/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panic-check-baseline
          path: .sisyphus/quality/panic-baseline.json
          retention-days: 90
