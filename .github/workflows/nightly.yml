# ── Nightly Build ─────────────────────────────────────────────────────
# Runs daily at 00:00 UTC (or on-demand via workflow_dispatch).
# Builds CLI, sandboxd, and Docker image; publishes to GHCR.

name: Nightly

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  # ── Build CLI (Linux x86_64) ──────────────────────────────────────
  build-cli:
    name: Build CLI (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p sisyphus-cli
      - uses: actions/upload-artifact@v4
        with:
          name: sisyphus-cli-linux
          path: target/release/sisyphus-cli
          retention-days: 7

  # ── Build Sandboxd (Linux x86_64) ─────────────────────────────────
  build-sandboxd:
    name: Build Sandboxd (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p sisyphus-sandboxd
      - uses: actions/upload-artifact@v4
        with:
          name: sisyphus-sandboxd-linux
          path: target/release/sisyphus-sandboxd
          retention-days: 7

  # ── Build CLI (macOS ARM64) ───────────────────────────────────────
  build-cli-macos:
    name: Build CLI (macOS ARM64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p sisyphus-cli --target aarch64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: sisyphus-cli-macos-arm64
          path: target/aarch64-apple-darwin/release/sisyphus-cli
          retention-days: 7

  # ── Build CLI (Windows x86_64) ────────────────────────────────────
  build-cli-windows:
    name: Build CLI (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p sisyphus-cli
      - uses: actions/upload-artifact@v4
        with:
          name: sisyphus-cli-windows
          path: target/release/sisyphus-cli.exe
          retention-days: 7

  # ── Build & Push Docker Image ─────────────────────────────────────
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [build-cli]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=schedule,pattern=nightly-{{date 'YYYYMMDD'}}
            type=raw,value=nightly
            type=sha,prefix=nightly-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Golden SOP library structural evaluation (P3-10) ─────────────
  golden-sop-eval:
    name: Golden SOP Evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p eval-runner --bin golden-sop-eval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-sop-eval-log
          path: golden_sop_report.txt
          retention-days: 30

  # ── HTTP client performance regression check (ADR-006 §J) ─────────
  # 跑 shared_http bench，与 `.sisyphus/eval-history/` 上次基线对比。
  # 失败条件 (任一即 fail):
  #   - 共享模式加速比 < 1.5x (连接复用失效)
  #   - 相对上次基线 < 0.8x (性能回归 20%+)
  http-client-bench:
    name: HTTP Client Performance Bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 拉取历史 jsonl 当基线；fetch-depth 0 保留全部 commit
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Run benchmark
        run: cargo run --release -p eval-runner --bin http-client-bench
        env:
          # 让 server 在 CI 安静运行（少 1-2s 启动时间）
          RUST_LOG: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: http-client-bench-report
          path: .sisyphus/eval-history/
          retention-days: 90

  # ── ADR-007 §1 panic 检查 (Rust 实现, 纯 workspace 工具) ─────────
  # 跑 no-panic-check binary 对比 baseline, 新增 panic 即 fail。
  panic-check:
    name: ADR-007 §1 No-Panic Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build -p eval-runner --bin no-panic-check
      - name: Self-tests
        run: cargo test -p eval-runner --bin no-panic-check
      - name: Run no-panic-check vs baseline
        run: |
          cargo run -p eval-runner --bin no-panic-check --             --baseline .sisyphus/quality/panic-baseline.json crates/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panic-check-baseline
          path: .sisyphus/quality/panic-baseline.json
          retention-days: 90
