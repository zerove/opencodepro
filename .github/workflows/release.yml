# ── Automated GitHub Release ─────────────────────────────────
# Triggered by pushing a tag matching 'v*' or manually.
# Builds all platform binaries and creates a GitHub Release.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.2.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build-cli-linux:
    timeout-minutes: 30
    name: Build CLI (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-protoc
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p sisyphus-cli
      - run: cp target/release/sisyphus-cli sisyphus-cli-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: sisyphus-cli-linux
          path: sisyphus-cli-linux-x86_64

  build-cli-macos:
    timeout-minutes: 40
    name: Build CLI (macOS ARM64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-apple-darwin
      - uses: ./.github/actions/setup-protoc
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p sisyphus-cli --target aarch64-apple-darwin
      - run: cp target/aarch64-apple-darwin/release/sisyphus-cli sisyphus-cli-macos-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: sisyphus-cli-macos
          path: sisyphus-cli-macos-arm64

  build-cli-windows:
    timeout-minutes: 40
    name: Build CLI (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-protoc
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p sisyphus-cli
      - run: cp target/release/sisyphus-cli.exe sisyphus-cli-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: sisyphus-cli-windows
          path: sisyphus-cli-windows-x86_64.exe

  build-sandboxd:
    timeout-minutes: 40
    name: Build Sandboxd (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p sisyphus-sandboxd
      - run: cp target/release/sisyphus-sandboxd sisyphus-sandboxd-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: sisyphus-sandboxd-linux
          path: sisyphus-sandboxd-linux-x86_64

  release:
    timeout-minutes: 20
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-cli-linux, build-cli-macos, build-cli-windows, build-sandboxd]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate Changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG="First release"
          else
            CHANGELOG=$(git log --oneline --no-decorate "$PREV_TAG..HEAD" 2>/dev/null || echo "Initial release")
          fi
          {
            echo 'CHANGELOG<<EOF'
            echo "## Changes since $PREV_TAG"
            echo ""
            echo "$CHANGELOG"
            echo ""
            echo "### Full Changelog"
            echo "${{ github.server_url }}/${{ github.repository }}/compare/$PREV_TAG...${{ github.ref_name }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: sisyphus-*
          path: release-assets/
      - uses: softprops/action-gh-release@v2
        with:
          name: Sisyphus ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.CHANGELOG }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: release-assets/**/*
