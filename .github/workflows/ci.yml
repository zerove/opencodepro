name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C debuginfo=0"

# ── Rust workspace ──────────────────────────────────────────────────────
# Heavy crates (wasmtime transitive): sisyphus-sandbox, sisyphus-sandboxd, sisyphus-tests
# Semi-heavy: sisyphus-bridge (default features enable sandbox)
#
# Per-crate isolation strategy to avoid CI OOM on 7GB runners:
#   cargo --workspace --exclude <heavy>  →  lightweight batch
#   cargo -p <heavy>                     →  per-crate jobs
#
# Reference: https://github.com/rust-lang/cargo/issues/13434

jobs:
  # ── Format check (fastest feedback) ────────────────────────────────
  fmt:
    timeout-minutes: 5
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 工具链来自 rust-toolchain.toml（由 setup-rust 读取），不在这里写死版本。
      # 只有一个来源是刻意的：rustfmt 的换行启发式随 nightly 漂移，2026-11 的
      # nightly 会把 crates/sisyphus-bridge/src/http/mod.rs 里 `.route(...)` 链
      # 改写成多行，而仓库现状（stable 1.99.1 与 nightly-2026-08-08 都判定为
      # 单行）是单行 → 「本地 fmt 绿、CI fmt 红」。升级工具链时改
      # rust-toolchain.toml 一处即可，所有 workflow 自动跟随。
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check

  # ── 结构审计：孤儿源文件 / 忽略测试理由（无需 Rust 工具链）──────────
  # 全部是纯静态扫描，放在格式检查之后作为快速反馈。
  audit-sources:
    name: Audit sources
    runs-on: ubuntu-latest
    # 六个审计脚本本地实测合计约 20 秒（脚本本身），加 rust/action 缓存
    # 未命中与 checkout 通常在 1 分钟内。给 5 分钟是十几倍余量，同时仍远低于
    # GitHub 默认的 360 分钟——第八轮实测剪枝前的 audit_orphans 要跑 924.7
    # 秒，正是这种「门禁不报错、只是不动」的退化态。超时要留出来，否则它会
    # 静默占用 runner 整整 6 小时。
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # audit_workflows.py 依赖 PyYAML。setup-python 带的解释器**不含** PyYAML，
      # 缺了会在最后一步直接失败（"需要 PyYAML：pip install pyyaml"），而前面三个
      # 脚本不需要 yaml 会全部通过——所以这个依赖以前一直没暴露，直到本 job 变红。
      - name: Install audit dependencies
        run: pip install pyyaml
      - name: Scan for source files never referenced by any crate
        run: python3 scripts/audit_orphans.py
      - name: Audit #[ignore] reasons
        run: python3 scripts/audit_ignored.py
      - name: Audit process-global state in tests
        run: python3 scripts/audit_test_global_state.py
      # TODO 勾选门禁：`- [x]` 声明「已验证」，必须附可解析证据（真实存在且
      # 未被 #[ignore] 的测试、真实存在的 make 目标或脚本）。本项目栽过的
      # 那一跤是 9.1 被勾选「完成」而生产链路从未跑通——靠人记拦不住。
      # 历史条目登记在 scripts/todo_baseline.txt（ratchet），新增勾选无证据即红。
      - name: Audit TODO checkbox evidence
        run: |
          python3 scripts/audit_todo.py
          python3 scripts/audit_todo.py --self-check
      # workflow 自身的引用完整性。放在本 job 里是刻意的：它只需要
      # checkout 出来的 YAML 与 PyYAML，不需要编译，几秒就能跑完。
      - name: Audit workflow step references
        run: |
          python3 scripts/audit_workflows.py
          python3 scripts/audit_workflows.py --self-check

      # Dockerfile 的依赖缓存层与 .dockerignore 必须和 workspace 成员一致。
      # 这两类缺陷**只在镜像内**复现：本地 cargo 一切正常，镜像里却
      # `failed to load manifest for workspace member`——多架构镜像发布
      # 因此静默失败了很久。
      - name: Audit Dockerfile deps layer vs workspace
        run: |
          python3 scripts/audit_dockerfile.py
          python3 scripts/audit_dockerfile.py --self-check

      # GitHub Actions 的 JSON Schema 校验。check-jsonschema 内置了官方
      # workflow schema，不需要联网拉取（actions 官方 schema 托管在
      # SchemaStore，CI 环境拉不到就会静默跳过校验——那正是它要防的情况）。
      #
      # 为什么必须在 CI 里：字段位置写错（step 级 vs job 级）、类型写错这类
      # 问题，本地 YAML 解析器**完全看不出**——它们语法合法，只有对照 schema
      # 才知道 GitHub 根本不接受。mdbook.yml 就曾把 job 级的 environment
      # 写在 step 里，本地所有检查全绿，部署时才暴露。
      - name: Validate workflows against GitHub Actions schema
        run: |
          pip install --quiet check-jsonschema==0.38.2
          check-jsonschema --builtin-schema vendor.github-workflows .github/workflows/*.yml
          # 官方口径的 timeout 必填校验，与 scripts/audit_workflows.py 的
          # jobs_without_timeout() 交叉对照，两边不一致会立刻暴露分歧
          check-jsonschema --builtin-schema github-workflows-require-timeout .github/workflows/*.yml

  # ── Supply-chain audit (cargo-deny: advisories, bans, licenses, sources) ─
  security-deny:
    timeout-minutes: 15
    name: Supply-chain audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny
      - name: Run cargo deny check
        run: cargo deny check

  # ── Lint: lightweight crates (no wasmtime in dep tree) ─────────────
  lint-light:
    timeout-minutes: 20
    name: Lint (light crates)
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-protoc
      - run: |
          cargo clippy \
            --workspace \
            --exclude sisyphus-sandbox \
            --exclude sisyphus-sandboxd \
            --exclude sisyphus-tests \
            --exclude sisyphus-bridge \
            -- -A clippy::double-must-use -D warnings

  # ── Lint: heavy crates (isolated to avoid OOM) ─────────────────────
  # ── ADR-007 §1 panic 检查 (PR-time 守护) ─────────────────────
  # 跑 no-panic-check binary self-test + 全 workspace 扫描.
  # 轻量: < 30s, 不需要 lint-light 依赖.
  panic-check:
    timeout-minutes: 30
    name: ADR-007 §1 No-Panic Check
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      # eval-runner 传递依赖 sisyphus-bridge-api，后者的 build script 需要 protoc
      # 生成 gRPC 桩。缺这一步时 `cargo test -p eval-runner --bin no-panic-check`
      # 在编译阶段就死在 `Could not find protoc`，no-panic 扫描根本没机会跑。
      - uses: ./.github/actions/setup-protoc
      - uses: Swatinem/rust-cache@v2
      - name: Build + self-test
        run: cargo test -p eval-runner --bin no-panic-check
      - name: Run scan
        run: |
          cargo run -p eval-runner --bin no-panic-check --             --baseline .sisyphus/quality/panic-baseline.json crates/

  lint-sandbox:
    timeout-minutes: 25
    name: Lint Sandbox
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-protoc
      - run: cargo clippy -p sisyphus-sandbox -- -A clippy::double-must-use -D warnings

  lint-tests:
    timeout-minutes: 20
    name: Lint Integration Tests
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-protoc
      - run: cargo clippy -p sisyphus-tests -- -A clippy::double-must-use -D warnings

  lint-sandboxd:
    timeout-minutes: 25
    name: Lint Sandboxd
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-protoc
      - run: cargo clippy -p sisyphus-sandboxd -- -A clippy::double-must-use -D warnings

  # ── Bridge (no sandbox) — trait abstraction layer, no wasmtime ─────
  bridge-check:
    timeout-minutes: 25
    name: Bridge (no sandbox)
    runs-on: ubuntu-latest
    needs: lint-light
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-protoc
      - run: cargo check -p sisyphus-bridge --no-default-features
      - run: cargo clippy -p sisyphus-bridge --no-default-features -- -A clippy::double-must-use -D warnings
      # `sandboxd_client::tests::*` 会**真的拉起** sisyphus-sandboxd 子进程来验证
      # 客户端与服务端的契约（错误命名、超时上界、真实工具执行）。这个 job 只
      # 编译 bridge 本身，target/debug/sisyphus-sandboxd 并不存在，于是三条测试
      # 在 `sandboxd_bin()` 里 panic（`sisyphus-sandboxd binary not found`）。
      # 本地一直是绿的——因为本机 target 里早就有那个二进制。
      - run: cargo build -p sisyphus-sandboxd
      - run: cargo test -p sisyphus-bridge --no-default-features --lib

  # ── Bridge integration tests (no sandbox, --no-default-features) ─────
  bridge-integration-test:
    name: Bridge Integration Tests (no sandbox)
    runs-on: ubuntu-latest
    needs: lint-light
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-protoc
      - run: cargo test -p sisyphus-bridge --no-default-features --test bridge_integration_test
      - run: cargo test -p sisyphus-bridge --no-default-features --test anti_entropy_integration
      - run: cargo test -p sisyphus-bridge --no-default-features --test cluster_integration
      - run: cargo test -p sisyphus-bridge --no-default-features --test chaos_extended
      - run: cargo test -p sisyphus-bridge --no-default-features --test cognitive_trace_rest_test
      - run: cargo test -p sisyphus-bridge --no-default-features --test hook_overhead

  # ── Tests: lightweight crates (full: lib + bin + doctests) ─────────
  test-light:
    timeout-minutes: 30
    name: Test (light crates)
    runs-on: ubuntu-latest
    needs: [lint-light, lint-sandbox, lint-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          # sisyphus-tools-build 的 fmt_check 测试调用 `cargo fmt`，需要 rustfmt 组件
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-protoc
      - run: |
          cargo test \
            --workspace \
            --exclude sisyphus-sandbox \
            --exclude sisyphus-sandboxd \
            --exclude sisyphus-tests \
            --exclude sisyphus-bridge

  # ── Unit tests: core (many tests, own job for speed) ────────────────
  test-core:
    timeout-minutes: 30
    name: Test Core
    runs-on: ubuntu-latest
    needs: [lint-light, lint-sandbox, lint-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-protoc
      - run: cargo test -p sisyphus-core

  # ── Unit tests: sandbox (wasmtime, isolated) ────────────────────────
  test-sandbox:
    timeout-minutes: 40
    name: Test Sandbox
    runs-on: ubuntu-latest
    needs: [lint-light, lint-sandbox, lint-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-protoc
      - run: cargo test -p sisyphus-sandbox --lib

  # ── Integration tests (wasmtime, isolated) ──────────────────────────
  test-integration:
    timeout-minutes: 40
    name: Test Integration
    runs-on: ubuntu-latest
    needs: [lint-light, lint-sandbox, lint-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-protoc
      - run: cargo test -p sisyphus-tests --lib

  # ── Sandboxd daemon integration tests (IPC protocol) ───────────────────
  test-sandboxd:
    timeout-minutes: 40
    name: Test Sandboxd
    runs-on: ubuntu-latest
    needs: [lint-sandboxd]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-protoc
      - run: cargo test -p sisyphus-sandboxd

  # ── Bridge (full features, with sandboxd) — tests all RPCs via real gRPC ──
  bridge-test-full:
    timeout-minutes: 40
    name: Bridge (full features + sandboxd)
    runs-on: ubuntu-latest
    needs: [lint-light, lint-sandboxd, bridge-integration-test]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-protoc
      - run: cargo clippy -p sisyphus-bridge -- -A clippy::double-must-use -D warnings
      - run: cargo test -p sisyphus-bridge --test bridge_integration_test
      - run: cargo test -p sisyphus-bridge --test skill_market_rest_test
      - run: cargo build --release -p sisyphus-sandboxd

  # ── CLI handler crate tests (clap parsing, output formatting) ──────────
  test-cli-handlers:
    timeout-minutes: 30
    name: Test CLI Handlers
    runs-on: ubuntu-latest
    needs: lint-light
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-protoc
      - run: cargo test -p sisyphus-cli

  # ── 真实工具链 e2e: language_backend_guards (go / python / maven) ─────
  # 单独 job 而非并入 test-light，因为需要装 3 套外部工具链。
  #
  # 为什么必须有：2026-10-04 一轮挖出 6 个测试守卫缺陷（Go 多包部分构建
  # 失败漏判、Python 全部通过报 passed=0、Node 混合结果计数错、vitest 套件
  # 失败守卫从不触发、失败名带 ANSI、Java/Maven 全通过报 passed=0 且编译
  # 失败被当成全通过）。**全部靠这个文件里的用例抓出来**，而它在改之前一直
  # 是 `#[ignore]` + 无 CI job，所以缺陷能长期存活。
  #
  # `--test-threads=1`：这些用例各自在 TempDir 里拉起真实编译器，并行会互相
  # 抢 CPU/GOMAXPROCS，导致超时型假失败。
  # Go 需要 `GOCACHE`（预置以避开 HOME 不可写）；Maven 首次跑要下插件，
  # 故单独给 20 min 超时。
  toolchain-e2e:
    name: Toolchain E2E (go/python/maven)
    runs-on: ubuntu-latest
    needs: lint-light
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-protoc

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # 不能写 `cache: maven`：它用 `**/pom.xml` 算缓存 key，而本仓库
          # 没有签入任何 pom.xml——Maven 探针是在测试里用 TempDir 现造的。
          # setup-java 的 cache.ts 对「无文件匹配」是直接 throw
          # （No file in ... matched to [...]），会让本 job 失败。
          # 探针工程每次都是全新的，本来也没有可复用的依赖缓存。

      - name: Install pytest
        run: python3 -m pip install --upgrade pytest

      - name: Report toolchain versions
        run: |
          go version
          python3 --version
          python3 -m pytest --version
          mvn --version
          java --version

      # go 探针在临时目录里跑，需要可写的 GOCACHE；GitHub runner 的 HOME
      # 在某些镜像上不可写，显式指到 runner.temp。
      - name: Run language backend guards (real toolchains)
        env:
          GOCACHE: ${{ runner.temp }}/gocache
        run: |
          cargo test -p sisyphus-tools-build \
            --test language_backend_guards \
            -- --ignored --test-threads=1

      # rust 后端的 e2e 不带 #[ignore]，已在 test-light 里跑过；这里只做
      # 一条断言防止它被误加 #[ignore] 而静默失去覆盖。
      #
      # 判据必须锚在 `#[test]` 上而不是 `#[ignore]`：该文件内有 `#[ignore]`
      # 字样，但那是**探针工程源码字符串里的**（用 `r#"..."#` 包住，模拟被
      # skip 的测试），不是本文件自己的测试属性。直接 `grep '#\[ignore'`
      # 会误报并让 CI 永远失败。
      - name: "Guard: rust e2e must not be ignored"
        run: |
          # 取出本文件自身声明的 #[test] ... fn 名字，再看它前面有没有 #[ignore]。
          python3 - <<'PY'
          import re, sys, pathlib
          p = pathlib.Path("crates/sisyphus-tools-build/tests/rust_backend_test_e2e.rs")
          src = p.read_text()
          # 去掉 r#"..."# / r"..." 探针源码，否则里面的 #[ignore] 会被看到
          stripped = re.sub(r'r#".*?"#', '', src, flags=re.S)
          ignored = re.findall(r'#\[ignore[^\]]*\]\s*(?:#\[[^\]]*\]\s*)*fn\s+(\w+)', stripped)
          if ignored:
              # 注意：f-string 的表达式部分不能含反斜杠（Python < 3.12 直接
              # SyntaxError）。这里曾写 `{', '.join(ignored)}` —— 本地 Python
              # 3.12+ 允许，CI 的 3.11 直接崩在解析阶段，整个 job 红而本地全绿。
              names = ", ".join(ignored)
              print(f"::error::rust_backend_test_e2e.rs 不得给这些测试加 #[ignore]：{names}")
              print("它们已在 test-light job 中执行，加 #[ignore] 会静默失去真实 cargo test 覆盖。")
              sys.exit(1)
          test_count = len(re.findall(r'#\[test\]', stripped))
          print(f"OK: 自身 {test_count} 条测试均未被 #[ignore]（探针源码内的 #[ignore] 已排除）")
          PY

  # ── E2E smoke test: start bridge → run stress_test --quick → verify ──
  e2e-smoke:
    timeout-minutes: 40
    name: E2E Smoke (bridge + stress)
    runs-on: ubuntu-latest
    needs: [bridge-test-full]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-protoc
      # Build both bridge and stress_test binary
      - run: cargo build -p sisyphus-bridge
      - run: cargo build -p sisyphus-bridge --bin stress_test
      # Start bridge in background, wait for it to be ready, run stress_test
      - name: E2E smoke test
        run: |
          # Use pre-built binary directly (avoid cargo run overhead)
          ./target/debug/sisyphus-bridge &
          BRIDGE_PID=$!
          # Give it time to start
          sleep 3
          # Run stress test using pre-built binary
          ./target/debug/stress_test --quick 2>&1
          STRESS_EXIT=$?
          # Report bridge logs
          echo "=== Bridge exit ==="
          kill $BRIDGE_PID 2>/dev/null || true
          wait $BRIDGE_PID 2>/dev/null || true
          exit $STRESS_EXIT

  # ── Chaos Engineering CI ────────────────────────────────────────────────
  chaos-test:
    name: Chaos Engineering Test
    runs-on: ubuntu-latest
    needs: [bridge-test-full]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-protoc
      - name: Build bridge with sandboxd
        run: |
          cargo build -p sisyphus-bridge --bin sisyphus-bridge --bin stress_test
      - name: Run chaos experiment
        timeout-minutes: 10
        run: |
          set -euo pipefail

          # Start bridge in background (LLM endpoint points at a dead port so
          # LLM-dependent phases of the cognitive loop fail fast instead of
          # hanging for the full HTTP timeout)
          SISYPHUS_LLM_ENDPOINT=http://127.0.0.1:9 \
          SISYPHUS_LLM_API_KEY=test \
          SISYPHUS_CHAOS_ENABLED=true \
          SISYPHUS_CHAOS_DEFAULT_FAULT_PROBABILITY=0.5 \
            ./target/debug/sisyphus-bridge > bridge-chaos.log 2>&1 &
          BRIDGE_PID=$!
          sleep 5

          # 1) Cognitive-loop smoke test (ExecuteSop) - must complete fast even
          #    without a reachable LLM thanks to the timeout/degradation paths.
          ./target/debug/stress_test --quick http://[::1]:50051 2>&1

          # 2) Chaos injection target: ExecuteTool requests exercise
          #    maybe_inject_chaos_fault before every tool call.
          ./target/debug/stress_test --tool http://[::1]:50051 2 5 2>&1

          # 3) Verify chaos faults were actually injected (not just that the
          #    bridge survived the load).
          INJECTIONS=$(grep -c "Chaos: injecting" bridge-chaos.log || true)
          echo "=== Chaos injections observed: $INJECTIONS ==="
          if [ "$INJECTIONS" -eq 0 ]; then
            echo "ERROR: no chaos faults were injected - chaos pipeline is not wired into ExecuteTool"
            exit 1
          fi

          # Report chaos experiment outcome
          echo "=== Chaos experiment completed (exit=0) ==="
          kill $BRIDGE_PID 2>/dev/null || true
          wait $BRIDGE_PID 2>/dev/null || true

  # ── Core benchmarks (requires sandbox feature for WasmToolExecutor) ──
  # Baseline tracking strategy:
  #   - Benchmarks run with --save-baseline current on every CI invocation.
  #   - On main branch, the 'current' baseline is renamed to 'main-baseline'
  #     and cached via actions/cache for future comparison.
  #   - On PRs, the cached main-baseline is restored, then critcmp compares
  #     'current' vs 'main-baseline'. Regressions >5% produce a warning but
  #     do NOT fail the job.
  #   - For precise local comparison, use make perf-analyze.
  bench-core:
    timeout-minutes: 45
    name: Bench Core
    runs-on: ubuntu-latest
    needs: [lint-light]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-protoc

      # Restore previously cached baseline from main branch
      - name: Restore baseline from cache
        id: cache-baseline
        uses: actions/cache/restore@v4
        with:
          path: target/criterion
          key: bench-baseline-main-${{ github.sha }}
          restore-keys: bench-baseline-main-

      # Run benchmarks, saving results as 'current' baseline
      # Filter out mfs_storage/large_100kb to avoid memory issues in CI (regex filter)
      - name: Run benchmarks
        run: cargo bench -p sisyphus-core --features sandbox --bench core_benches -- --save-baseline current --warm-up-time 1 --measurement-time 2 --sample-size 10 "dag_execution|wasm_execution|mfs_storage/(set_small|get_small|set_medium_10kb|get_medium_10kb)|v2_adaptive_depth|v2_anomaly_detector|v2_branch_predictor"

      # Compare with cached baseline using critcmp (warn-only, never fails)
      - name: Install critcmp and compare with baseline
        if: steps.cache-baseline.outputs.cache-hit == 'true'
        run: |
          cargo install critcmp --locked
          echo "::group::Critcmp: current vs main-baseline"
          critcmp current main-baseline 2>&1 || true
          echo "::endgroup::"

          # Parse JSON output for >5% regressions
          critcmp current main-baseline --json 2>&1 > /tmp/critcmp_diff.json || true
          python3 << 'PYEOF'
          import json, sys
          try:
              with open('/tmp/critcmp_diff.json') as f:
                  data = json.load(f)
          except (json.JSONDecodeError, FileNotFoundError):
              print("critcmp JSON output not available, skipping regression check")
              sys.exit(0)

          threshold = 5.0
          regressions = []
          for name, info in data.items():
              if not isinstance(info, dict):
                  continue
              change = info.get('change', 0)
              if isinstance(change, (int, float)) and change > threshold:
                  regressions.append((name, change))

          if regressions:
              print(f"::warning::Performance regression >{threshold}% detected in {len(regressions)} benchmark(s)")
              for n, p in regressions:
                  print(f"::warning::  {n}: {p:.1f}% slower")
          else:
              print("No performance regressions >5% detected. Performance is stable.")
          PYEOF

      # On main branch, persist current run as 'main-baseline' for future comparisons
      # Benchmarks are in nested dirs: target/criterion/<group>/<name>/current
      - name: Save baseline (main only)
        if: github.ref_name == 'main'
        run: |
          for dir in target/criterion/*/*/; do
            if [ -d "${dir}current" ]; then
              cp -r "${dir}current" "${dir}main-baseline"
            fi
          done

      - name: Cache benchmark baseline (main only)
        if: github.ref_name == 'main'
        uses: actions/cache/save@v4
        with:
          path: target/criterion
          key: bench-baseline-main-${{ github.sha }}

      # ── Bench Dashboard (P0: gh-pages 部署替代方案) ──────────────────
      # 生成 docs/benchmarks/dashboard/index.html + 上传 artifact。
      # 全 PR + main 都跑（不依赖 baseline cache）。
      # 部署策略：mdbook.yml 部署时把 bench dashboard 合并到 gh-pages/bench/
      # 路径（详见 .github/workflows/mdbook.yml 的 deploy step）。
      #
      # 不用 `|| echo` 兜底：continue-on-error 已经保证 job 不会红，而 `|| echo`
      # 是把退出码转成 0，会顺手吞掉脚本真正的失败原因。保留 continue-on-error
      # 就够了——dashboard 是辅助产物，不该阻塞合并，但失败要留在日志里。
      - name: Generate bench dashboard
        run: ./scripts/bench-dashboard.sh
        env:
          OUTPUT_DIR: ${{ runner.temp }}/bench-dashboard
        continue-on-error: true

      # id 必填：下面的 PR 评论要引用这个 step 的 outputs。
      # 原先这里没写 id，却引用了 steps.upload-artifact.outputs.artifact-url，
      # 而 GitHub 只为显式声明 id 的 step 暴露 outputs——那些引用会静默展开成
      # 空字符串，PR 上渲染成 `([详情]())` 的空链接和「跑  大小」缺数字的句子。
      # 这类缺陷不会让 CI 变红，只能靠读渲染结果发现。
      #
      # if 里不用 hashFiles 判断产物存在：它评估的是 job 开始时的文件状态，
      # 对同 job 内刚生成的 ${{ runner.temp }} 文件不作保证（mdbook.yml:88 的
      # 用法检查的是仓库内已存在的文件，语义不同，不能照搬）。上传本身幂等且
      # 带 if-no-files-found: ignore，让它直接跑；成败由 conclusion 如实反映，
      # 下面的评论据此判断。
      - name: Upload bench dashboard artifact
        id: bench-dashboard
        uses: actions/upload-artifact@v4
        with:
          name: bench-dashboard
          path: ${{ runner.temp }}/bench-dashboard
          retention-days: 90
          if-no-files-found: ignore

      # 只在确实上传成功时才评论。原先用 hashFiles 判断，在同 job 内刚生成的
      # 文件上不可靠——它可能为真而上传实际失败（或反之），评论就会指向一个
      # 不存在的 artifact。改判 steps.bench-dashboard.conclusion。
      - name: Comment PR with bench summary
        id: bench-comment
        if: >-
          github.event_name == 'pull_request' &&
          steps.bench-dashboard.conclusion == 'success' &&
          steps.bench-dashboard.outputs.artifact-id != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: bench-dashboard
          message: |
            📊 **Bench Dashboard** — 已上传 artifact（保留 90 天）
            在本 run 的 Actions 页面底部下载 `bench-dashboard`；含 criterion 报告（分布/回归/对比图）。
            本地查看：`./scripts/bench-dashboard.sh` 然后浏览器打开 `docs/benchmarks/dashboard/index.html`

  # ── CLI release builds ──────────────────────────────────────────────
  build:
    timeout-minutes: 40
    name: Build
    runs-on: ubuntu-latest
    needs: [test-light, test-core, test-sandbox, test-integration, bridge-check, toolchain-e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-protoc
      - run: cargo build --release -p sisyphus-cli
      - uses: actions/upload-artifact@v4
        with:
          name: sisyphus-cli-linux
          path: target/release/sisyphus

  build-sandboxd:
    timeout-minutes: 40
    name: Build Sandboxd
    runs-on: ubuntu-latest
    needs: [lint-sandboxd]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-protoc
      - run: cargo build --release -p sisyphus-sandboxd
      - uses: actions/upload-artifact@v4
        with:
          name: sisyphus-sandboxd-linux
          path: target/release/sisyphus-sandboxd

  build-macos:
    timeout-minutes: 40
    name: Build (macOS)
    runs-on: macos-latest
    needs: [test-light, test-core, test-sandbox, test-integration]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-protoc
      - run: cargo build --release -p sisyphus-cli --target aarch64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: sisyphus-cli-macos-arm64
          path: target/aarch64-apple-darwin/release/sisyphus

  build-windows:
    timeout-minutes: 40
    name: Build (Windows)
    runs-on: windows-latest
    needs: [test-light, test-core, test-sandbox, test-integration]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-protoc
      - run: cargo build --release -p sisyphus-cli
      - uses: actions/upload-artifact@v4
        with:
          name: sisyphus-cli-windows
          path: target/release/sisyphus.exe

  # ── SDK builds ──────────────────────────────────────────────────────
  sdk-typescript:
    timeout-minutes: 15
    name: TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd ide/typescript-sdk && npm install
      - run: cd ide/typescript-sdk && npm run build
      - run: cd ide/typescript-sdk && npm test

  sdk-python:
    timeout-minutes: 15
    name: Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: cd ide/python-sdk && pip install pytest
      - run: cd ide/python-sdk && python -m pytest tests/

  sdk-go:
    timeout-minutes: 15
    name: Go SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: cd ide/go-sdk && go test ./...

  webui-check:
    timeout-minutes: 20
    name: WebUI Check
    runs-on: ubuntu-latest
    needs: lint-light
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-protoc
      - run: cargo check -p sisyphus-webui
      - run: cargo clippy -p sisyphus-webui -- -A clippy::double-must-use -D warnings
      - run: cargo test -p sisyphus-webui

  # ── Release ─────────────────────────────────────────────────────────
  release:
    timeout-minutes: 20
    name: Release
    runs-on: ubuntu-latest
    needs: [build, build-sandboxd, build-macos, build-windows, sdk-typescript, sdk-python, sdk-go, chaos-test, webui-check]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sisyphus-cli-linux/sisyphus-cli
            sisyphus-sandboxd-linux/sisyphus-sandboxd
            sisyphus-cli-macos-arm64/sisyphus-cli
            sisyphus-cli-windows/sisyphus-cli.exe
          generate_release_notes: true
