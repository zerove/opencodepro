name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Build & check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --exclude sisyphus-sandbox --exclude sisyphus-bridge

      - name: cargo build
        run: cargo build --workspace --exclude sisyphus-sandbox --exclude sisyphus-bridge

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"

      - name: cargo test (lib first, fast feedback)
        run: |
          for crate in \
            sisyphus-types \
            sisyphus-metrics \
            sisyphus-intel \
            sisyphus-mem \
            sisyphus-tests \
            sisyphus-core \
            sisyphus-tools \
            sisyphus-cli \
            sisyphus-roadmap \
          ; do
            echo "=== Testing $crate (lib) ==="
            cargo test -p "$crate" --lib 2>&1
            echo ""
          done

      - name: cargo test (integration/slow)
        run: |
          for crate in \
            sisyphus-types \
            sisyphus-metrics \
            sisyphus-intel \
            sisyphus-mem \
            sisyphus-tests \
            sisyphus-core \
            sisyphus-tools \
            sisyphus-cli \
            sisyphus-roadmap \
          ; do
            echo "=== Testing $crate (integration) ==="
            cargo test -p "$crate" --test '*' 2>&1
            echo ""
          done
        # sisyphus-sandbox excluded — wasmtime 45 OOM on low-memory runners
        # sisyphus-bridge excluded — rustc 1.96.0 ICE, fixed in 1.97.0 (2026-07-09)
        # codegen-units=1（workspace 级 profile）使单 rustc 进程即可耗尽 ~20GB VM。
        # 升级 rustc/wasmparser 后可尝试移除 codegen-units=1 以大幅提速编译。

  cargo-deny:
    name: Supply chain audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          log-level: warn
          arguments: --workspace --all-features
