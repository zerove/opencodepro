name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C debuginfo=0"

# ── Rust workspace ──────────────────────────────────────────────────────
# Heavy crates (wasmtime transitive): sisyphus-sandbox, sisyphus-sandboxd, sisyphus-tests
# Semi-heavy: sisyphus-bridge (default features enable sandbox)
#
# Per-crate isolation strategy to avoid CI OOM on 7GB runners:
#   cargo --workspace --exclude <heavy>  →  lightweight batch
#   cargo -p <heavy>                     →  per-crate jobs
#
# Reference: https://github.com/rust-lang/cargo/issues/13434

jobs:
  # ── Format check (fastest feedback) ────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check

  # ── Lint: lightweight crates (no wasmtime in dep tree) ─────────────
  lint-light:
    name: Lint (light crates)
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo clippy \
            --workspace \
            --exclude sisyphus-sandbox \
            --exclude sisyphus-sandboxd \
            --exclude sisyphus-tests \
            --exclude sisyphus-bridge \
            -- -D warnings

  # ── Lint: heavy crates (isolated to avoid OOM) ─────────────────────
  lint-sandbox:
    name: Lint Sandbox
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p sisyphus-sandbox -- -D warnings

  lint-tests:
    name: Lint Integration Tests
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p sisyphus-tests -- -D warnings

  lint-sandboxd:
    name: Lint Sandboxd
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p sisyphus-sandboxd -- -D warnings

  # ── Bridge (no sandbox) — trait abstraction layer, no wasmtime ─────
  bridge-check:
    name: Bridge (no sandbox)
    runs-on: ubuntu-latest
    needs: lint-light
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p sisyphus-bridge --no-default-features
      - run: cargo clippy -p sisyphus-bridge --no-default-features -- -D warnings
      - run: cargo test -p sisyphus-bridge --no-default-features --lib

  # ── Unit tests: lightweight crates ─────────────────────────────────
  test-light:
    name: Test (light crates)
    runs-on: ubuntu-latest
    needs: [lint-light, lint-sandbox, lint-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo test --lib \
            --workspace \
            --exclude sisyphus-sandbox \
            --exclude sisyphus-sandboxd \
            --exclude sisyphus-tests \
            --exclude sisyphus-bridge

  # ── Unit tests: core (many tests, own job for speed) ────────────────
  test-core:
    name: Test Core
    runs-on: ubuntu-latest
    needs: [lint-light, lint-sandbox, lint-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p sisyphus-core --lib

  # ── Unit tests: sandbox (wasmtime, isolated) ────────────────────────
  test-sandbox:
    name: Test Sandbox
    runs-on: ubuntu-latest
    needs: [lint-light, lint-sandbox, lint-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p sisyphus-sandbox --lib

  # ── Integration tests (wasmtime, isolated) ──────────────────────────
  test-integration:
    name: Test Integration
    runs-on: ubuntu-latest
    needs: [lint-light, lint-sandbox, lint-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p sisyphus-tests --lib

  # ── Sandboxd daemon integration tests (IPC protocol) ───────────────────
  test-sandboxd:
    name: Test Sandboxd
    runs-on: ubuntu-latest
    needs: [lint-sandboxd]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p sisyphus-sandboxd

  # ── Bridge (full features, with sandboxd) — tests all RPCs via real gRPC ──
  bridge-test-full:
    name: Bridge (full features + sandboxd)
    runs-on: ubuntu-latest
    needs: [lint-light, lint-sandboxd]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p sisyphus-bridge -- -D warnings
      - run: cargo test -p sisyphus-bridge --test bridge_integration_test
      - run: cargo build --release -p sisyphus-sandboxd

  # ── CLI handler crate tests (clap parsing, output formatting) ──────────
  test-cli-handlers:
    name: Test CLI Handlers
    runs-on: ubuntu-latest
    needs: lint-light
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p sisyphus-cli --lib

  # ── E2E smoke test: start bridge → run stress_test --quick → verify ──
  e2e-smoke:
    name: E2E Smoke (bridge + stress)
    runs-on: ubuntu-latest
    needs: [bridge-test-full]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      # Build both bridge and stress_test binary
      - run: cargo build -p sisyphus-bridge
      - run: cargo build -p sisyphus-bridge --bin stress_test
      # Start bridge in background, wait for it to be ready, run stress_test
      - name: E2E smoke test
        run: |
          # Start bridge in background
          cargo run -p sisyphus-bridge &
          BRIDGE_PID=$!
          # Give it time to start
          sleep 3
          # Run stress test against it
          cargo run -p sisyphus-bridge --bin stress_test -- --quick 2>&1
          STRESS_EXIT=$?
          # Report bridge logs
          echo "=== Bridge exit ==="
          kill $BRIDGE_PID 2>/dev/null || true
          wait $BRIDGE_PID 2>/dev/null || true
          exit $STRESS_EXIT

  # ── Core benchmarks (requires sandbox feature for WasmToolExecutor) ──
  bench-core:
    name: Bench Core
    runs-on: ubuntu-latest
    needs: [lint-light]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench -p sisyphus-core --features sandbox -- --warm-up-time 1 --measurement-time 2 --sample-size 10

  # ── CLI release builds ──────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test-light, test-core, test-sandbox, test-integration, bridge-check]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p sisyphus-cli
      - uses: actions/upload-artifact@v4
        with:
          name: sisyphus-cli-linux
          path: target/release/sisyphus-cli

  build-sandboxd:
    name: Build Sandboxd
    runs-on: ubuntu-latest
    needs: [lint-sandboxd]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p sisyphus-sandboxd
      - uses: actions/upload-artifact@v4
        with:
          name: sisyphus-sandboxd-linux
          path: target/release/sisyphus-sandboxd

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    needs: [test-light, test-core, test-sandbox, test-integration]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p sisyphus-cli --target aarch64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: sisyphus-cli-macos-arm64
          path: target/aarch64-apple-darwin/release/sisyphus-cli

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    needs: [test-light, test-core, test-sandbox, test-integration]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p sisyphus-cli
      - uses: actions/upload-artifact@v4
        with:
          name: sisyphus-cli-windows
          path: target/release/sisyphus-cli.exe

  # ── SDK builds ──────────────────────────────────────────────────────
  sdk-typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd ide/typescript-sdk && npm install && npm run build

  sdk-python:
    name: Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: cd ide/python-sdk && python -m py_compile sisyphus_sdk/__init__.py

  webui-check:
    name: WebUI Check
    runs-on: ubuntu-latest
    needs: lint-light
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p sisyphus-webui

  # ── Release ─────────────────────────────────────────────────────────
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, build-sandboxd, build-macos, build-windows, sdk-typescript, sdk-python]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sisyphus-cli-linux/sisyphus-cli
            sisyphus-sandboxd-linux/sisyphus-sandboxd
            sisyphus-cli-macos-arm64/sisyphus-cli
            sisyphus-cli-windows/sisyphus-cli.exe
          generate_release_notes: true
