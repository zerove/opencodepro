name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C debuginfo=0"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --lib
      - run: cargo test -p sisyphus-core --lib

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p sisyphus-cli
      - uses: actions/upload-artifact@v4
        with:
          name: sisyphus-cli-linux
          path: target/release/sisyphus-cli

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p sisyphus-cli --target aarch64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: sisyphus-cli-macos-arm64
          path: target/aarch64-apple-darwin/release/sisyphus-cli

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p sisyphus-cli
      - uses: actions/upload-artifact@v4
        with:
          name: sisyphus-cli-windows
          path: target/release/sisyphus-cli.exe

  sdk-typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd ide/typescript-sdk && npm install && npm run build

  sdk-python:
    name: Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: cd ide/python-sdk && python -m py_compile sisyphus_sdk/__init__.py

  webui-check:
    name: WebUI Check
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p sisyphus-webui

  bridge-check:
    name: Bridge (no sandbox)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p sisyphus-bridge --no-default-features
      - run: cargo clippy -p sisyphus-bridge --no-default-features -- -D warnings
      - run: cargo test -p sisyphus-bridge --no-default-features --lib

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, build-macos, build-windows, sdk-typescript, sdk-python]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sisyphus-cli-linux/sisyphus-cli
            sisyphus-cli-macos-arm64/sisyphus-cli
            sisyphus-cli-windows/sisyphus-cli.exe
          generate_release_notes: true
