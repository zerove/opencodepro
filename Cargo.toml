[workspace]
members = [
    "crates/sisyphus-core",
    "crates/sisyphus-bridge",
    "crates/sisyphus-sandbox",
    "crates/sisyphus-intel",
    "crates/sisyphus-mem",
    "crates/sisyphus-types",
    "crates/sisyphus-metrics",
    "crates/sisyphus-tests",
    "crates/sisyphus-tools",
    "crates/sisyphus-cli",
    "crates/sisyphus-roadmap",
    "evals",
]
# Exclude heavy crates (wasmtime) from default `cargo check`/`cargo test`
default-members = [
    "crates/sisyphus-cli",
    "crates/sisyphus-core",
    "crates/sisyphus-intel",
    "crates/sisyphus-mem",
    "crates/sisyphus-metrics",
    "crates/sisyphus-tests",
    "crates/sisyphus-tools",
    "crates/sisyphus-types",
    "crates/sisyphus-roadmap",
    # sisyphus-bridge, sisyphus-sandbox excluded → add -p to compile explicitly
]
resolver = "2"

[workspace.dependencies]
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "json", "env-filter"] }

[profile.dev]
debug = 0
opt-level = 0
codegen-units = 1
incremental = false

# sisyphus-intel test compilation needs more codegen-units to avoid SIGABRT
# (wasmparser ICE requires workspace default codegen-units=1)
[profile.dev.package.sisyphus-intel]
codegen-units = 1

# sisyphus-types: proptest tests in lib.rs produce large codegen units
[profile.dev.package.sisyphus-types]
codegen-units = 1

# cranelift-codegen (wasmtime 36/45+) is extremely large; needs many codegen-units to avoid OOM
[profile.dev.package.cranelift-codegen]
codegen-units = 1

[profile.dev.package.cranelift-native]
codegen-units = 1

[profile.dev.package.sisyphus-core]
codegen-units = 1

[profile.dev.package.tokio]
codegen-units = 1
[profile.dev.package.wasmtime]
codegen-units = 1

# wasmtime 45 cranelift crates are even larger; need more codegen-units
[profile.dev.package.cranelift-entity]
codegen-units = 1

[profile.dev.package.cranelift-bitset]
codegen-units = 1

[profile.dev.package.cranelift-control]
codegen-units = 1

[profile.dev.package.regalloc2]
codegen-units = 1

[profile.dev.package.wasmtime-internal-cranelift]
codegen-units = 1

[profile.dev.package.wasmtime-internal-core]
codegen-units = 1

# pulley-interpreter (wasmtime 45) — extremely large single-file interpreter; ICE with codegen-units=1
[profile.dev.package.pulley-interpreter]
codegen-units = 1

# reqwest and its heavy transitive deps need more codegen-units to avoid OOM
[profile.dev.package.reqwest]
codegen-units = 1
[profile.dev.package.hyper]
codegen-units = 1
[profile.dev.package.h2]
codegen-units = 1
[profile.dev.package.syn]
codegen-units = 1
[profile.dev.package.proc-macro2]
codegen-units = 1
[profile.dev.package.quote]
codegen-units = 1
[profile.dev.package.hyper-util]
codegen-units = 1
[profile.dev.package.rustls]
codegen-units = 1
[profile.dev.package.schannel]
codegen-units = 1
[profile.dev.package.windows-sys]
codegen-units = 1
[profile.dev.package.tokio-rustls]
codegen-units = 1
[profile.dev.package.thiserror-impl]
codegen-units = 1

# axum-core (tonic transport dep) — large async router internals
[profile.dev.package.axum-core]
codegen-units = 1

# openssl (tonic transport transitive dep) — FFI-heavy bindings
[profile.dev.package.openssl]
codegen-units = 1
[profile.dev.package.openssl-sys]
codegen-units = 1

# regex-automata (ignore + regex dep) — multi-engine DFA/NFA compilation
[profile.dev.package.regex-automata]
codegen-units = 1

# clap_builder (sisyphus-cli dep) — large CLI derive machinery
[profile.dev.package.clap_builder]
codegen-units = 1

# ignore (sisyphus-tools dep) — recursive filesystem walker with glob + gitignore
[profile.dev.package.ignore]
codegen-units = 1
[profile.dev.package.globset]
codegen-units = 1

# sisyphus-bridge — rustc 1.96.0 ICE: `cargo check -p sisyphus-bridge` crashes with SIGTERM
# during type resolution (not LLVM). Root cause: tonic+wasmtime async trait type complexity
# triggers a rustc regression. No profile override can fix this.
# 
# RESOLVED in nightly 1.98.0+ (rustc f28ac764c, 2026-06-23). Will ship with 1.97.0 stable (2026-07-09).
# Project has `rustup override set nightly` active.
#
# Workaround (legacy, for 1.96.0): `cargo check-all`/`test-all`/`build-all` aliases auto --exclude,
# or `RUSTFLAGS="-C lto=off" cargo check -p sisyphus-bridge` (see Makefile).
# See https://github.com/rust-lang/rust/issues (rustc 1.96.0, LLVM 22.1.2)
# [profile.dev.package.sisyphus-bridge]
# codegen-units = N (<-- still crashes regardless of value)

# h2 is already 256, but also add http and http-body which are heavily inlined
[profile.dev.package.http]
codegen-units = 1
[profile.dev.package.http-body]
codegen-units = 1

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
