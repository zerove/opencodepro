[workspace]
members = [
    "crates/sisyphus-core",
    "crates/sisyphus-bridge",
    "crates/sisyphus-sandbox",
    "crates/sisyphus-intel",
    "crates/sisyphus-mem",
    "crates/sisyphus-types",
    "crates/sisyphus-metrics",
    "crates/sisyphus-tests",
    "crates/sisyphus-tools-core",
    "crates/sisyphus-tools-llm",
    "crates/sisyphus-tools-scm",
    "crates/sisyphus-tools-build",
    "crates/sisyphus-tools-system",
    "crates/sisyphus-tools-mcp",
    "crates/sisyphus-tools-llm-tools",
    "crates/sisyphus-tools-session",
    "crates/sisyphus-tools-executor",
    "crates/sisyphus-tools-agent",
    "crates/sisyphus-cli",
    "crates/sisyphus-roadmap",
    "crates/sisyphus-bridge-api",
    "evals", "crates/sisyphus-knowledge", "crates/sisyphus-visual",
    "crates/sisyphus-wasm-sdk",
]
# Exclude heavy crates (wasmtime) from default `cargo check`/`cargo test`
default-members = [
    "crates/sisyphus-cli",
    "crates/sisyphus-core",
    "crates/sisyphus-intel",
    "crates/sisyphus-mem",
    "crates/sisyphus-metrics",
    "crates/sisyphus-tests",
    "crates/sisyphus-types",
    "crates/sisyphus-tools-executor",
    "crates/sisyphus-tools-agent",
    "crates/sisyphus-roadmap",
    # sisyphus-bridge, sisyphus-sandbox excluded → add -p to compile explicitly
]
resolver = "2"

[workspace.dependencies]
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3" }
serde = "1.0"
serde_json = "1.0"
thiserror = "1.0"
async-trait = "0.1"
anyhow = "1.0"
dashmap = "6.1"

[profile.dev]
debug = 0
opt-level = 0
codegen-units = 16
incremental = false

# Heavy wasmtime/cranelift deps: 高并行度分摊单线程内存压力
[profile.dev.package.wasmtime]
codegen-units = 64
[profile.dev.package.cranelift-codegen]
codegen-units = 256
[profile.dev.package.cranelift-control]
codegen-units = 64
[profile.dev.package.regalloc2]
codegen-units = 64
[profile.dev.package.wasmtime-internal-cranelift]
codegen-units = 64

# Heavy net/HTTP deps: 增加并行度以分摊内存
[profile.dev.package.reqwest]
codegen-units = 64
[profile.dev.package.hyper]
codegen-units = 64
[profile.dev.package.h2]
codegen-units = 256
[profile.dev.package.syn]
codegen-units = 128
[profile.dev.package.proc-macro2]
codegen-units = 64
[profile.dev.package.hyper-util]
codegen-units = 64
[profile.dev.package.rustls]
codegen-units = 64

# Heavy gRPC/crypto deps (bridge): 分摊 tonic/prost/ring 编译内存
[profile.dev.package.tonic]
codegen-units = 64
[profile.dev.package.tonic-build]
codegen-units = 64
[profile.dev.package.prost]
codegen-units = 64
[profile.dev.package.prost-build]
codegen-units = 64
[profile.dev.package.ring]
codegen-units = 64
[profile.dev.package.tokio-rustls]
codegen-units = 64

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
