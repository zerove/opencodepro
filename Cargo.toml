[workspace]
members = [
    "crates/sisyphus-core",
    "crates/sisyphus-bridge",
    "crates/sisyphus-sandbox",
    "crates/sisyphus-intel",
    "crates/sisyphus-mem", "crates/sisyphus-types",
]
resolver = "2"

[profile.dev]
debug = 0
opt-level = 0
codegen-units = 1
incremental = false

# sisyphus-intel test compilation needs more codegen-units to avoid SIGABRT
# (wasmparser ICE requires workspace default codegen-units=1)
[profile.dev.package.sisyphus-intel]
codegen-units = 16

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
