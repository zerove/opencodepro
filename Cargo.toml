[workspace]
members = [
    "crates/sisyphus-core",
    "crates/sisyphus-bridge",
    "crates/sisyphus-sandbox",
    "crates/sisyphus-intel",
    "crates/sisyphus-mem",
    "crates/sisyphus-types",
    "crates/sisyphus-metrics",
    "crates/sisyphus-tests",
    "crates/sisyphus-tools-core",
    "crates/sisyphus-tools-llm",
    "crates/sisyphus-tools-scm",
    "crates/sisyphus-tools-build",
    "crates/sisyphus-tools-system",
    "crates/sisyphus-tools-mcp",
    "crates/sisyphus-tools-llm-tools",
    "crates/sisyphus-tools-session",
    "crates/sisyphus-tools-executor",
    "crates/sisyphus-tools-agent",
    "crates/sisyphus-cli",
    "crates/sisyphus-roadmap",
    "crates/sisyphus-bridge-api",
    "evals",
]
# Exclude heavy crates (wasmtime) from default `cargo check`/`cargo test`
default-members = [
    "crates/sisyphus-cli",
    "crates/sisyphus-core",
    "crates/sisyphus-intel",
    "crates/sisyphus-mem",
    "crates/sisyphus-metrics",
    "crates/sisyphus-tests",
    "crates/sisyphus-types",
    "crates/sisyphus-tools-executor",
    "crates/sisyphus-tools-agent",
    "crates/sisyphus-roadmap",
    # sisyphus-bridge, sisyphus-sandbox excluded → add -p to compile explicitly
]
resolver = "2"

[workspace.dependencies]
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3" }
serde = "1.0"
serde_json = "1.0"
thiserror = "1.0"
async-trait = "0.1"
anyhow = "1.0"

[profile.dev]
debug = 0
opt-level = 0
incremental = true

[profile.release]
panic = "abort"
lto = "thin"
