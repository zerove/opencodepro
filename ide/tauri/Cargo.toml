[package]
name = "sisyphus-tauri"
version = "0.1.0"
description = "Sisyphus desktop application"
authors = ["Sisyphus Team"]
license = "MIT"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
dirs = "6"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "sisyphus_tauri_lib"
crate-type = ["lib", "cdylib", "staticlib"]
