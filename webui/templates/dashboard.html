<div class="stat">
    <span class="label">Status</span>
    <span class="value {% if health_status == 'ok' %}status-ok{% else %}status-err{% endif %}">
        {{ health_status }}
    </span>
</div>
<div class="stat">
    <span class="label">Version</span>
    <span class="value">{{ health_version }}</span>
</div>
<div class="stat">
    <span class="label">Uptime</span>
    <span class="value">{{ uptime_secs }}s</span>
</div>
<div class="stat">
    <span class="label">Active Sessions</span>
    <span class="value">{{ session_count }}</span>
</div>
