[package]
name = "sisyphus-webui"
version = "0.1.0"
description = "Sisyphus web dashboard (axum + HTMX)"
authors = ["Sisyphus Team"]
license = "MIT"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json"] }
askama = "0.12"

[lib]
name = "sisyphus_webui_lib"
crate-type = ["lib"]
