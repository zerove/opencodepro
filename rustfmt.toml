# Sisyphus rustfmt configuration.
#
# The whole workspace is formatted against this config today: CI runs
# `cargo fmt --check` as a blocking job and it passes. (It previously
# claimed the codebase had never been regenerated and that `cargo fmt
# --all` would produce thousands of diffs — that was stale.)
#
# Stable options only. The unstable options we'd like (imports_granularity,
# group_imports, etc.) are gated on nightly and would produce warnings on
# stable — see https://github.com/rust-lang/rustfmt/issues/5085.

edition = "2021"
# max_width and chain_width = 100 fit GitHub PR review screens and
# match the prevailing style for new files added in 2025+.
max_width = 100
chain_width = 100
use_try_shorthand = true
reorder_imports = true
reorder_modules = true
match_block_trailing_comma = true
