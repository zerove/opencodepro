version: '3.8'

services:
  node-a:
    build:
      context: .
      dockerfile: Dockerfile
    image: sisyphus-bridge:local
    environment:
      - RUST_LOG=info
      - SISYPHUS_CLUSTER__ENABLED=true
      - SISYPHUS_CLUSTER__NODE_ID=node-a
      - SISYPHUS_CLUSTER__STATIC_PEERS=["http://node-b:50051", "http://node-c:50051"]
    ports:
      - "50051:50051"
      - "8080:8080"
    networks:
      - sisyphus-net

  node-b:
    image: sisyphus-bridge:local
    environment:
      - RUST_LOG=info
      - SISYPHUS_CLUSTER__ENABLED=true
      - SISYPHUS_CLUSTER__NODE_ID=node-b
      - SISYPHUS_CLUSTER__STATIC_PEERS=["http://node-a:50051", "http://node-c:50051"]
    ports:
      - "50052:50051"
      - "8081:8080"
    networks:
      - sisyphus-net

  node-c:
    image: sisyphus-bridge:local
    environment:
      - RUST_LOG=info
      - SISYPHUS_CLUSTER__ENABLED=true
      - SISYPHUS_CLUSTER__NODE_ID=node-c
      - SISYPHUS_CLUSTER__STATIC_PEERS=["http://node-a:50051", "http://node-b:50051"]
    ports:
      - "50053:50051"
      - "8082:8080"
    networks:
      - sisyphus-net

networks:
  sisyphus-net:
    driver: bridge
