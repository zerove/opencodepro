# cargo-deny configuration for Sisyphus supply chain audit
# Auto-generated from `cargo deny init` and adapted for the project.

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = [
    # eval-runner (evals/) → reqwest 0.11 → rustls-pemfile 1.0.4 is archived.
    # Not in production crate tree; will resolve when eval-runner updates reqwest.
    "RUSTSEC-2025-0134",
    # sisyphus-mem pins lru = "0.12"; the 0.16.3 fix is incompatible.
    # Pre-existing, not introduced by refactoring.
    "RUSTSEC-2026-0002",
    # ratatui 0.28 → paste 1.0.15 (archived). Needs ratatui ≥0.29.
    # Pre-existing, not introduced by refactoring.
    "RUSTSEC-2024-0436",
    # utoipa-gen 4.x → proc-macro-error 1.0.4 (unmaintained, not a vulnerability).
    # utoipa-gen 5.x requires axum 0.8 (breaking upgrade across the workspace).
    # Tracked: https://github.com/rust-lang/rustsec/issues (proc-macro-error).
    "RUSTSEC-2024-0370",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "BSL-1.0",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow-workspace = true
deny = []
skip = [
    # wasmtime pulls in multiple hashbrown versions
    { name = "hashbrown", version = "0.14" },
    { name = "hashbrown", version = "0.15" },
    # Different petgraph versions from wasmtime vs prost-build
    { name = "petgraph", version = "0.6" },
    { name = "petgraph", version = "0.7" },
    # Two metrics versions coexist (0.21 for our code, 0.22 by exporter)
    { name = "metrics", version = "0.21" },
    { name = "metrics", version = "0.22" },
    # fixedbitset duplicated via petgraph versions
    { name = "fixedbitset", version = "0.4" },
    { name = "fixedbitset", version = "0.5" },
]
skip-tree = [
    # wasmtime and its many deps
    { name = "wasmtime", version = "45" },
    # tonic and its protobuf toolchain
    { name = "tonic", version = "0.12" },
    # sqlx with bundled libsqlite3-sys
    { name = "sqlx", version = "0.8" },
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
