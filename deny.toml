# cargo-deny configuration for Sisyphus supply chain audit
# Auto-generated from `cargo deny init` and adapted for the project.

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = [
    # wasmtime 25.0.3: known vulnerabilities; pinned by sisyphus-sandbox
    # Tech debt: upgrade to >=36.0.7
    "RUSTSEC-2025-0046",
    "RUSTSEC-2025-0118",
    "RUSTSEC-2026-0020",
    "RUSTSEC-2026-0021",
    "RUSTSEC-2026-0085",
    "RUSTSEC-2026-0086",
    "RUSTSEC-2026-0087",
    "RUSTSEC-2026-0088",
    "RUSTSEC-2026-0089",
    "RUSTSEC-2026-0091",
    "RUSTSEC-2026-0092",
    "RUSTSEC-2026-0093",
    "RUSTSEC-2026-0094",
    "RUSTSEC-2026-0095",
    "RUSTSEC-2026-0096",
    # paste 1.0 is unmaintained; transitive via wasmtime, not our direct dep
    "RUSTSEC-2024-0436",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "BSL-1.0",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow-workspace = true
deny = []
skip = [
    # wasmtime pulls in multiple hashbrown versions
    { name = "hashbrown", version = "0.14" },
    { name = "hashbrown", version = "0.15" },
    # Different petgraph versions from wasmtime vs prost-build
    { name = "petgraph", version = "0.6" },
    { name = "petgraph", version = "0.7" },
    # Two metrics versions coexist (0.21 for our code, 0.22 by exporter)
    { name = "metrics", version = "0.21" },
    { name = "metrics", version = "0.22" },
    # fixedbitset duplicated via petgraph versions
    { name = "fixedbitset", version = "0.4" },
    { name = "fixedbitset", version = "0.5" },
]
skip-tree = [
    # wasmtime and its many deps
    { name = "wasmtime", version = "25" },
    # tonic and its protobuf toolchain
    { name = "tonic", version = "0.12" },
    # sqlx with bundled libsqlite3-sys
    { name = "sqlx", version = "0.8" },
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
