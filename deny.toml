# cargo-deny configuration for Sisyphus supply chain audit
# Auto-generated from `cargo deny init` and adapted for the project.
#
# 运行：
#   cargo deny check              # 全套检查（licenses + bans + advisories + sources）
#   cargo deny check advisories   # 仅 advisory
#   cargo deny check licenses     # 仅 license
#
# 状态：2026-09-04 审计

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
# ── 已解决（移出 ignore，需保持依赖更新）────────────────────────────────
# RUSTSEC-2026-0269 (wasmtime 47.0.3) → 47.0.4 修复（cargo update -p wasmtime）
# RUSTSEC-2026-0258 (h2 0.4.15) → 0.4.16 修复（cargo update -p h2@0.4.15）

ignore = [
    # ── RUSTSEC-2026-0247/0251: bitmaps/sized-chunks is unmaintained (imbl transitive) ──
    # 来源: imbl 2.0.3 仍依赖 bitmaps 2.1 + sized-chunks 0.6（im 已 archive，
    # 但 imbl 还没替换这些子依赖）。
    # 修复: 等待 imbl 上游迁移（GitHub issue 跟踪）— 或 imbl 升级。
    # 当前代码 sisyphus-types 只用 imbl::HashMap（同 im::HashMap 用法），
    # 未触及 OrdSet/sized-chunks 路径。
    # 跟踪: https://github.com/jneem/imbl/issues
    "RUSTSEC-2026-0247",

    # ── RUSTSEC-2026-0253: lru 0.12.x use-after-free in pop() ──
    # 来源: ratatui 0.28.x → lru 0.12.5（含 UB）；sisyphus-mem 直接依赖 lru 0.12。
    # 修复: lru 0.18.2+ 修复 panic safety。
    # 阻塞: ratatui 0.28 锁 lru 0.12.x，升级需 ratatui 0.29+（破坏性 API 变化）。
    # 实际影响: 仅当 unwinding panic + Drop-panicking key 时触发；sisyphus-mem 的 key 是 String，
    #          Drop 不会 panic，因此实际不可达。
    # 跟踪: 阶段 8.x — 评估 ratatui 0.29 升级可行性（TODO 8.4.2）。
    "RUSTSEC-2026-0253",

    # ── RUSTSEC-2025-0134: rustls-pemfile 1.0.4 (archived) ──
    # 来源: eval-runner (evals/) → reqwest 0.11 → rustls-pemfile 1.0.4（archived）。
    # 不在生产 crate 树，eval-runner 更新 reqwest 时自动解决。
    # 跟踪: evals/ 升级 reqwest 至 0.12。
    "RUSTSEC-2025-0134",

    # ── RUSTSEC-2026-0002: lru 0.16.3 fix incompatibility (memory crate) ──
    # 来源: sisyphus-mem pins lru = "0.12"；0.16.3 修复与 API 不兼容。
    # 预存在，非本轮重构引入。
    # 跟踪: 阶段 8.x — 评估 lru 0.18+ 升级（与 RUSTSEC-2026-0253 联动）。
    "RUSTSEC-2026-0002",

    # ── RUSTSEC-2024-0436: paste 1.0.15 (archived) ──
    # 来源: ratatui 0.28 → paste 1.0.15（archived）。需要 ratatui ≥0.29。
    # 跟踪: 阶段 8.x — 评估 ratatui 0.29 升级。
    "RUSTSEC-2024-0436",

    # ── RUSTSEC-2026-0258: h2 0.3.x (unbounded empty DATA frames) ──
    # 来源: reqwest 0.11 → h2 0.3.27（patched 在 h2 0.4.16+，但 0.3 分支不维护）。
    # 严重性: Low（CVE 编号 GHSA-q83h-524g-xf6h，reachability 受限）。
    # 阻塞: h2 0.3.x 是 hyper 0.14.x 的 lockfile 版本，hyper 0.14 锁 reqwest 0.11。
    # 修复: reqwest 0.11 → 0.12（h2 0.4.x 已升级到 0.4.19）。
    # 跟踪: evals/ 升级 reqwest 至 0.12 时自动解决。
    "RUSTSEC-2026-0258",

    # ── RUSTSEC-2026-0292: imbl-sized-chunks 0.1.3 double free / UAF ──
    # 触发点: `Chunk::{clear, drop_left, drop_right}` 与
    #         `InlineArray::{clear, truncate}` 先 drop 元素、后更新元数据；
    #         元素 Drop panic 时元数据陈旧 → 二次 drop（safe Rust 可达）。
    # 来源: imbl 2.0.3 → imbl-sized-chunks 0.1.3（crates.io 最新 imbl 已 7.0.2）。
    # 实际不可达（已核实）: 本仓库只用 `imbl::HashMap`，
    #         `imbl-2.0.3/src/hash/map.rs` 对 `sized_chunks` 的引用数为 0；
    #         受影响的是 OrdSet/OrdMap 的有序集合路径，本仓库未使用。
    #         全仓 imbl:: 引用均集中在测试 fixture 的 `imbl::HashMap::new()`。
    # 阻塞: 修复需 imbl-sized-chunks >= 0.2.0，而 imbl 2.0.3 将其锁死；
    #       放宽需 imbl 2 → 7（跳 5 个大版本，属独立破坏性变更）。
    # 跟踪: 评估 imbl 2 → 7 迁移时一并解决；届时删除本条豁免。
    "RUSTSEC-2026-0292",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "BSL-1.0",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow-workspace = true
deny = []
skip = [
    # wasmtime pulls in multiple hashbrown versions
    { name = "hashbrown", version = "0.14" },
    { name = "hashbrown", version = "0.15" },
    # Different petgraph versions from wasmtime vs prost-build
    { name = "petgraph", version = "0.6" },
    { name = "petgraph", version = "0.7" },
    # Two metrics versions coexist (0.21 for our code, 0.22 by exporter)
    { name = "metrics", version = "0.21" },
    { name = "metrics", version = "0.22" },
    # fixedbitset duplicated via petgraph versions
    { name = "fixedbitset", version = "0.4" },
    { name = "fixedbitset", version = "0.5" },
    # h2: 0.3.x (reqwest 0.11 legacy) vs 0.4.x (modern)
    { name = "h2", version = "0.3" },
    { name = "h2", version = "0.4" },
]
skip-tree = [
    # wasmtime and its many deps
    { name = "wasmtime", version = "48" },
    # tonic and its protobuf toolchain
    { name = "tonic", version = "0.12" },
    # sqlx with bundled libsqlite3-sys
    { name = "sqlx", version = "0.8" },
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []