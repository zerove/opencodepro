# ── Sisyphus Docker Compose ───────────────────────────────────────────
# Usage:
#   docker compose up -d                     # Start bridge only
#   docker compose --profile db up -d        # Start bridge + PostgreSQL
#   docker compose down                      # Stop everything
#
# Bridge gRPC endpoint:  [::1]:50051
# Bridge HTTP endpoint:  localhost:8080
# PostgreSQL endpoint:   localhost:5432 (when db profile is enabled)

services:
  # ── Sisyphus Bridge ─────────────────────────────────────────────────
  bridge:
    build:
      context: .
      dockerfile: Dockerfile
    # 默认 owner 必须是真实推送该包的账号（ghcr.io/zerove/...）：workflows 里
    # IMAGE_NAME 是 `${{ github.repository_owner }}/sisyphus-bridge`，产品名固定。
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-zerove}/sisyphus-bridge:${TAG:-latest}
    ports:
      - "50051:50051"
      - "8080:8080"
    environment:
      - SISYPHUS_CONFIG=/app/config.toml
      - RUST_LOG=${RUST_LOG:-info}
    volumes:
      - sisyphus-data:/app/data
    networks:
      - sisyphus-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 50051 || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  # ── PostgreSQL (optional) ──────────────────────────────────────────
  # Enable with: docker compose --profile db up -d
  postgres:
    profiles:
      - db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sisyphus
      POSTGRES_PASSWORD: sisyphus
      POSTGRES_DB: sisyphus
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - sisyphus-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sisyphus"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sisyphus-data:
  postgres-data:

networks:
  sisyphus-net:
    driver: bridge
