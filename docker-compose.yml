services:
  bridge:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "50051:50051"
      - "9100:9100"
    environment:
      - SISYPHUS_CONFIG=/app/config.toml
    networks:
      - sisyphus-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - sisyphus-net
    depends_on:
      - bridge
    restart: unless-stopped

networks:
  sisyphus-net:
    driver: bridge
